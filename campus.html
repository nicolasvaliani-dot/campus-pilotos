(function(root){'use strict';
function uuid(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();const bytes=new Uint8Array(16);if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(bytes);else for(let i=0;i<16;i++)bytes[i]=Math.floor(Math.random()*256);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const h=[...bytes].map(n=>n.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;}
const norm=n=>((Number(n)%360)+360)%360,delta=n=>((n+540)%360)-180;
const shuffle=(list,rng=Math.random)=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const blank=()=>({lessons:[],attempts:[],challenges:{},cards:{},last:null});
function evaluate(q,a){switch(q.type||'mcq'){
case 'multi':return Array.isArray(a)&&a.length===q.correct.length&&q.correct.every(x=>a.includes(x));
case 'number':case 'instrument':return a!==''&&a!==null&&a!==undefined&&Number.isFinite(Number(a))&&Math.abs(Number(a)-Number(q.answer))<=Number(q.tolerance||0);
case 'order':return Array.isArray(a)&&a.length===q.items.length&&q.items.every((_,i)=>a[i]===i);
case 'match':return a&&q.pairs.every((_,i)=>Number(a[i])===i);
case 'hotspot':return a&&Number.isFinite(a.x)&&Math.hypot(a.x-q.target.x,a.y-q.target.y)<=q.target.radius;
default:return a!==null&&a!==undefined&&Number(a)===Number(q.correct);
}}
function grade(qs,answers){const details=qs.map(q=>({id:q.id,selected:answers[q.id]??null,correct:!!evaluate(q,answers[q.id]),prompt:q.prompt,explanation:q.explanation}));return {score:qs.length?Math.round(100*details.filter(x=>x.correct).length/qs.length):0,answers:details};}
const matches=(a,c,mode,lesson)=>a.course===c.id&&a.mode===mode&&(!lesson||a.lesson===lesson);
const best=(r,c,mode,lesson)=>Math.max(0,...r.attempts.filter(a=>matches(a,c,mode,lesson)).map(a=>a.score));
function weak(r,c){const m=new Map();[...r.attempts].sort((a,b)=>a.at.localeCompare(b.at)).filter(a=>a.course===c.id||['final','mock'].includes(a.mode)).forEach(a=>a.answers.forEach(x=>m.set(x.id,x.correct)));return c.questions.filter(q=>m.get(q.id)===false);}
function training(r,c,subs=[]){const done=c.lessons.filter(l=>r.lessons.includes(l.id)).length,passed=c.lessons.filter(l=>best(r,c,'lesson',l.id)>=c.lessonPass).length;const submission=subs.find(s=>s.course_id===c.id);const tp=!c.tp.required||submission?.status==='approved';return {done,passed,tp,submission,ready:c.lessons.length>0&&done===c.lessons.length&&passed===c.lessons.length&&tp};}

function solution(q){switch(q.type){case 'multi':return q.correct.map(i=>q.options[i]).join('; ');case 'number':case 'instrument':return q.answer+' '+(q.unit||'');case 'order':return q.items.join(' → ');case 'match':return q.pairs.map(p=>p.left+': '+p.right).join('; ');case 'hotspot':return 'Zona señalada por el instructor';default:return q.options[q.correct];}}

const input=e=>{if(e.target.name?.startsWith('accessible-')){const p=e.target.closest('.answer-fields'),x=p.querySelector('[name=accessible-x]').value,y=p.querySelector('[name=accessible-y]').value;if(x!==''&&y!=='')point(p.querySelector('.hotspot'),Number(x),Number(y));}};
const start=e=>{dragging=e.target.closest('[data-order]');if(dragging)e.dataTransfer.setData('text/plain',dragging.dataset.order);};const over=e=>{if(e.target.closest('[data-order]'))e.preventDefault();};const drop=e=>{const target=e.target.closest('[data-order]');if(dragging&&target&&target!==dragging){e.preventDefault();target.parentNode.insertBefore(dragging,target);}dragging=null;};
root.addEventListener('click',click);root.addEventListener('input',input);root.addEventListener('dragstart',start);root.addEventListener('dragover',over);root.addEventListener('drop',drop);return()=>{root.removeEventListener('click',click);root.removeEventListener('input',input);root.removeEventListener('dragstart',start);root.removeEventListener('dragover',over);root.removeEventListener('drop',drop);};}

<script>
(function(root){'use strict';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=n=>(n%360+360)%360;
const pressure=h=>101325*Math.pow(1-6.87535e-6*clamp(h,-1000,20000),5.2561);
const altitude=p=>(1-Math.pow(Math.max(p,100)/101325,1/5.2561))/6.87535e-6;
const dynamic=ias=>.5*1.225*(ias*.514444)**2;
function sensed(s,m={}){const p=pressure(s.alt),q=dynamic(s.speed);let ps=p,pt=p+q;
if(s.staticBlocked){if(m.staticP===undefined)m.staticP=p;ps=m.staticP;}else delete m.staticP;
if(s.pitotBlocked&&s.drainBlocked){if(m.totalP===undefined)m.totalP=m.lastTotalP===undefined?p+q:m.lastTotalP;pt=m.totalP;}else{delete m.totalP;if(s.pitotBlocked)pt=p;}
m.lastTotalP=pt;return {ias:Math.sqrt(Math.max(0,2*(pt-ps)/1.225))/.514444,alt:altitude(ps),staticP:ps,totalP:pt};}
function engine(s){const base=s.power,active=[];if(s.ignition==='BOTH'||s.ignition==='L')active.push('left');if(s.ignition==='BOTH'||s.ignition==='R')active.push('right');for(const side of ['left','right'])if(s[side]==='plead'&&!active.includes(side))active.push(side);
const live=active.filter(x=>s[x]!=='dead');if(!live.length)return {rpm:0,rough:false,active};const weak=live.filter(x=>s[x]==='weak').length;
let drop=live.length===2?(weak?weak*100:0):s[live[0]]==='weak'?420:live[0]==='left'?70:90;
return {rpm:Math.max(0,base-drop),rough:weak>0,active};}
function turnRate(bank,speed){return 9.80665*Math.tan(bank*Math.PI/180)/Math.max(speed*.514444,20)*180/Math.PI;}
const dme=(horizontal,heightFeet)=>Math.hypot(horizontal,heightFeet/6076.11549);
const quadrant=(x,y)=>Math.hypot(x,y)<.01?'estación':Math.abs(x)<.001?(y<0?'N':'S'):Math.abs(y)<.001?(x>0?'E':'O'):(y<0?'N':'S')+(x>0?'E':'O');
const api={dme,quadrant,clamp,norm,pressure,altitude,dynamic,sensed,engine,turnRate};root.SimPhysics=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

je del pitot')}${fault('cp-static','Tapar toma estática')}${fault('cp-vacuum','Falla de succión')}${fault('cp-electric','Falla eléctrica del coordinador')}<p class="muted">El drenaje solo, con entrada abierta, no altera la indicación en este modelo seco.</p><button class="button secondary" id="cp-reveal" aria-expanded="false">Mostrar fallas y explicación</button><section id="cp-fault-report" hidden><h3>Fallas preparadas</h3><p>Cargá un caso para observar su efecto. Cada caso restablece las otras fallas.</p><div class="fault-presets"><button class="button secondary small" data-case="inlet">Pitot tapado</button><button class="button secondary small" data-case="sealed">Pitot y drenaje</button><button class="button secondary small" data-case="static">Estática tapada</button><button class="button secondary small" data-case="vacuum">Sin succión</button><button class="button secondary small" data-case="electric">Coordinador sin energía</button><button class="button secondary small" data-case="mag">Magneto izquierdo débil</button></div><div id="cp-report-body"></div></section></aside></div><section class="card magneto-lab"><h2>Prueba de magnetos</h2><div class="mag-bench"><div class="bench-tach"><svg id="cp-rpm-bench" viewBox="0 0 240 240" role="img" aria-label="Tacómetro junto a la llave de magnetos"></svg><strong id="cp-bench-rpm">1700 RPM</strong></div><div class="key-station"><svg id="cp-key" viewBox="0 0 280 240" role="img" aria-label="Llave de encendido BOTH"></svg><div class="ignition-buttons"><button type="button" data-ignition="OFF">OFF</button><button type="button" data-ignition="R">R</button><button type="button" data-ignition="L">L</button><button type="button" data-ignition="BOTH">BOTH</button></div><label>Llave de encendido<select id="cp-ignition"><option>BOTH</option><option>L</option><option>R</option><option>OFF</option></select></label><p>Seleccioná una posición y observá la caída en este tacómetro.</p></div></div><div class="mag-grid"><div>${control('cp-power','RPM de referencia en BOTH',1000,2400,1700,'RPM')}<div class="row"><button class="button secondary small" id="cp-start">Arrancar motor</button><button class="button secondary small" id="cp-log">Registrar lectura</button></div></div><div>${['left','right'].map((k,i)=>`<label>Magneto ${i?'derecho':'izquierdo'}<select id="cp-${k}"><option value="normal">Normal</option><option value="weak">Encendido débil / bujía defectuosa</option><option value="dead">Sin encendido</option><option value="plead">Cable de masa abierto</option></select></label>`).join('')}<div class="limit-inputs"><label>Caída máxima de ejemplo<input id="cp-maxdrop" type="number" value="150" min="0" max="1000"> RPM</label><label>Diferencia máxima de ejemplo<input id="cp-maxdiff" type="number" value="50" min="0" max="1000"> RPM</label></div></div><div><h3>Lecturas registradas</h3><p id="cp-log-readings">Registrá BOTH, L y R sin cambiar potencia ni fallas.</p><p id="cp-mag-explain" aria-live="polite"></p></div></div><p class="muted">L deja activo el izquierdo y pone a masa el derecho; R hace lo contrario. Volvé a BOTH entre comprobaciones. Límites y RPM de prueba: consultar el manual aplicable.</p></section>${sources}`;}
function bezel(content){return `<defs><clipPath id="gauge-clip"><circle cx="120" cy="120" r="91"/></clipPath></defs><rect x="3" y="3" width="234" height="234" rx="30" fill="#30353a"/>${[[17,17],[223,17],[17,223],[223,223]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#111"/><path d="M${x-2} ${y+2}l4-4" stroke="#888"/>`).join('')}<circle cx="120" cy="120" r="109" fill="#11161c" stroke="#68717a" stroke-width="5"/><circle cx="120" cy="120" r="100" fill="#10151a"/>${content}<circle cx="120" cy="120" r="4" fill="#e4e1cc"/>`;}

function horizon(pitch,bank){return bezel(`<g clip-path="url(#gauge-clip)"><g transform="rotate(${-bank} 120 120) translate(0 ${pitch*2})"><rect x="-150" y="-350" width="550" height="470" fill="#34749b"/><rect x="-150" y="120" width="550" height="500" fill="#8a613e"/><path d="M-100 120H340" stroke="#fff" stroke-width="2"/>${[-20,-10,10,20].map(n=>`<path d="M${n%20?100:90} ${120-n*2}h${n%20?40:60}" stroke="#eee"/>`).join('')}</g></g><path d="M57 120h42l8 7h26l8-7h42" fill="none" stroke="#f6ce50" stroke-width="4"/><path d="M120 22l-6 11h12Z" fill="#fff"/>${[-60,-30,0,30,60].map(a=>`<path d="M120 29v9" transform="rotate(${a} 120 120)" stroke="#ddd"/>`).join('')}`);}
function compass(h){return bezel(`<g transform="rotate(${-h} 120 120)">${Array.from({length:36},(_,i)=>`<g transform="rotate(${i*10} 120 120)"><path d="M120 26v${i%3?8:14}" stroke="#eee"/>${i%3?'':`<text x="120" y="60" text-anchor="middle" fill="#eee" font-size="18">${({0:'N',9:'E',18:'S',27:'W'})[i]||i}</text>`}</g>`).join('')}</g><path d="M120 20l-6 12h12Z" fill="#f0cb5e"/><path d="M120 79v84M80 125h80M106 155h28" stroke="#e1dfc9" stroke-width="4"/><text x="120" y="193" text-anchor="middle" fill="#ddd" font-size="13">${String(Math.round(P.norm(h))%360).padStart(3,'0')}°</text>`);}
function altimeter(value){return bezel(Array.from({length:50},(_,i)=>`<path d="M120 24v${i%5?6:12}" transform="rotate(${i*7.2} 120 120)" stroke="#ddd"/>`).join('')+Array.from({length:10},(_,i)=>{const a=i*Math.PI/5;return `<text x="${120+Math.sin(a)*72}" y="${126-Math.cos(a)*72}" fill="#eee" font-size="20" text-anchor="middle">${i}</text>`;}).join('')+`<text x="120" y="85" fill="#bbb" text-anchor="middle" font-size="10">ALT · ft</text><path d="M120 130V45" stroke="#efebd4" stroke-width="3" transform="rotate(${value/1000*360} 120 120)"/><path d="M120 130V74" stroke="#efebd4" stroke-width="6" transform="rotate(${value/10000*360} 120 120)"/><rect x="83" y="160" width="74" height="24" rx="3" fill="#29323a"/><text x="120" y="177" fill="#fff" font-size="16" text-anchor="middle">${Math.round(value)}</text>`);}
function coordinator(rate,off){return bezel(`<path d="M45 125h38M157 125h38" stroke="#eee" stroke-width="2"/><g transform="rotate(${P.clamp(rate*6,-30,30)} 120 120)"><path d="M120 82v68M75 115h90M104 140h32" stroke="#ddd" stroke-width="4"/></g><rect x="65" y="162" width="110" height="23" rx="12" fill="#8d969c"/><circle cx="120" cy="173" r="10" fill="#111"/><text x="120" y="204" fill="#ddd" font-size="10" text-anchor="middle">${off?'SIN ENERGÍA':'ELÉCTRICO · VIRAJE COORDINADO'}</text>`);}

function mount(root){const $=id=>root.querySelector('#'+id);let s={speed:100,alt:3000,vsi:0,bank:0,heading:90,pitotBlocked:false,drainBlocked:false,staticBlocked:false,vacuum:false,electric:false,power:1700,ignition:'BOTH',left:'normal',right:'normal'},m={},rpm=1700,running=true,paused=false,last=0,raf,disposed=false,acc=0,gyroAge=0,gyroBank=0,gyroPitch=0,gyroHdg=90,indVsi=0,prevAlt=3000,logs={},lastVacOff=false,history=[];

ccionar L el motor se detiene. ':s.left==='plead'?'El magneto izquierdo no se puede poner a masa. ':'')+(s.right==='weak'?'Magneto derecho débil: con R aparece una caída excesiva.':s.right==='dead'?'Magneto derecho sin chispa: con R el motor se detiene.':s.right==='plead'?'El magneto derecho no se puede poner a masa.':'')+'</p>':'')+(history.length?'<h3>Acciones realizadas</h3><ul>'+history.slice(-8).map(x=>'<li>'+x+'</li>').join('')+'</ul>':'');}
function plumbing(){const col=b=>b?'#c4574c':'#4b9bb1';$('cp-plumbing').innerHTML=`<path d="M36 53H180v35H130" fill="none" stroke="#b1b9c1" stroke-width="16"/><path d="M180 72H280v56" stroke="${col(s.pitotBlocked)}" stroke-width="3" fill="none"/><circle cx="36" cy="53" r="9" fill="${col(s.pitotBlocked)}"/><circle cx="146" cy="88" r="5" fill="${col(s.drainBlocked)}"/><circle cx="40" cy="135" r="8" fill="${col(s.staticBlocked)}"/><path d="M48 135H245" stroke="${col(s.staticBlocked)}" stroke-width="3"/><text x="16" y="26" font-size="12">Entrada ${s.pitotBlocked?'cerrada':'abierta'}</text><text x="120" y="112" font-size="12">Drenaje ${s.drainBlocked?'cerrado':'abierto'}</text><text x="20" y="166" font-size="12">Estática ${s.staticBlocked?'cerrada':'abierta'}</text>`;}
function render(){const r=P.sensed(s,m),tr=P.turnRate(s.bank,s.speed),pitch=Math.atan2(s.vsi/60,s.speed*1.68781)*180/Math.PI;
$('cp-asi').innerHTML=dial(r.ias,0,200,'AIRSPEED','kt');$('cp-att').innerHTML=horizon(gyroPitch,gyroBank);$('cp-alt').innerHTML=altimeter(r.alt);$('cp-turn').innerHTML=coordinator(s.electric?0:tr,s.electric);$('cp-hdg').innerHTML=compass(gyroHdg);$('cp-vsi').innerHTML=verticalSpeed(indVsi);$('cp-rpm').innerHTML=dial(rpm,0,3000,'ENGINE','RPM');$('cp-rpm-bench').innerHTML=dial(rpm,0,3000,'ENGINE','RPM');$('cp-bench-rpm').textContent=Math.round(rpm)+' RPM';$('cp-key').innerHTML=ignitionKey(s.ignition);$('cp-key').setAttribute('aria-label','Llave de encendido '+s.ignition);for(const b of root.querySelectorAll('[data-ignition]'))b.setAttribute('aria-pressed',b.dataset.ignition===s.ignition);
for(const [id,label] of [['asi',`${Math.round(r.ias)} nudos indicados`],['alt',`${Math.round(r.alt)} pies indicados`],['vsi',`${Math.round(indVsi)} pies por minuto`],['rpm',`${Math.round(rpm)} RPM`]])$('cp-'+id).setAttribute('aria-label',label);
$('cp-true-speed').textContent=s.speed+' kt';$('cp-true-alt').textContent=Math.round(s.alt)+' ft';$('cp-true-hdg').textContent=Math.round(P.norm(s.heading))%360+'°';$('cp-true-vsi').textContent=Math.round(s.vsi)+' ft/min';$('cp-rpm-value').textContent=Math.round(rpm);$('cp-vac').textContent=(s.vacuum?0:Math.min(5,rpm/1000*5)).toFixed(1);$('cp-vac-status').textContent=s.vacuum||rpm<600?'SUCCIÓN BAJA / PERDIDA':'SUCCIÓN NORMAL';$('cp-vac-status').classList.toggle('fault',s.vacuum||rpm<600);

$('cp-altitude').value=s.alt;$('cp-altitude-out').textContent=Math.round(s.alt)+' ft';}
function resetLogs(){logs={};$('cp-log-readings').textContent='Registrá BOTH, L y R sin cambiar potencia ni fallas.';}
const sliders=[['cp-speed','speed','kt'],['cp-altitude','alt','ft'],['cp-vspeed','vsi','ft/min'],['cp-bank','bank','°'],['cp-power','power','RPM']];for(const [id,key,unit] of sliders)$(id).oninput=e=>{s[key]=Number(e.target.value);$(id+'-out').textContent=s[key]+' '+unit;if(key==='alt')prevAlt=P.sensed(s,m).alt;if(key==='power')resetLogs();render();};
for(const [id,key] of [['cp-pitot','pitotBlocked'],['cp-drain','drainBlocked'],['cp-static','staticBlocked'],['cp-vacuum','vacuum'],['cp-electric','electric']])$(id).onchange=e=>{s[key]=e.target.checked;history.push(e.target.parentElement.textContent.trim()+': '+(s[key]?'activada':'desactivada'));P.sensed(s,m);if(key==='vacuum')gyroAge=0;explain();plumbing();render();};
for(const key of ['ignition','left','right'])$('cp-'+key).onchange=e=>{s[key]=e.target.value;history.push((key==='ignition'?'Llave':key==='left'?'Magneto izquierdo':'Magneto derecho')+': '+e.target.options[e.target.selectedIndex].text);if(key!=='ignition')resetLogs();explain();if(P.engine(s).rpm===0)running=false;render();};
for(const b of root.querySelectorAll('[data-ignition]'))b.onclick=()=>{$('cp-ignition').value=b.dataset.ignition;$('cp-ignition').onchange({target:$('cp-ignition')});};

for(const b of root.querySelectorAll('[data-case]'))b.onclick=()=>{$('cp-reset').onclick();const which=b.dataset.case;if(which==='inlet'||which==='sealed'){s.pitotBlocked=true;$('cp-pitot').checked=true;}if(which==='sealed'){s.drainBlocked=true;$('cp-drain').checked=true;}if(which==='static'){s.staticBlocked=true;$('cp-static').checked=true;}if(which==='vacuum'){s.vacuum=true;$('cp-vacuum').checked=true;}if(which==='electric'){s.electric=true;$('cp-electric').checked=true;}if(which==='mag'){s.left='weak';s.ignition='L';$('cp-left').value='weak';$('cp-ignition').value='L';}history.push('Caso cargado: '+b.textContent);P.sensed(s,m);explain();plumbing();render();};
$('cp-start').onclick=()=>{if(P.engine(s).rpm>0)running=true;render();};$('cp-pause').onclick=()=>{paused=!paused;$('cp-pause').textContent=paused?'Reanudar vuelo':'Pausar vuelo';};

$('cp-log').onclick=()=>{const key=s.ignition;if(!['BOTH','L','R'].includes(key)||!running)return;const target=P.engine(s).rpm;if(Math.abs(rpm-target)>10){$('cp-log-readings').textContent='Esperá que se estabilicen las RPM antes de registrar.';return;}logs[key]=Math.round(rpm);let msg=Object.entries(logs).map(([k,v])=>`${k}: ${v} RPM`).join(' · ');if(['BOTH','L','R'].every(k=>logs[k]!==undefined)){const dl=logs.BOTH-logs.L,dr=logs.BOTH-logs.R,diff=Math.abs(logs.L-logs.R),max=Number($('cp-maxdrop').value),maxDiff=Number($('cp-maxdiff').value);msg+=` | Caída L ${dl}, R ${dr}; diferencia ${diff} RPM. `+(dl<=0||dr<=0?'Sin caída en al menos una selección: investigar el circuito de puesta a masa.':dl>max||dr>max||diff>maxDiff?'Fuera de los límites de ejemplo.':'Dentro de los límites de ejemplo.');}$('cp-log-readings').textContent=msg;};
function frame(t){if(disposed)return;const dt=last?Math.min((t-last)/1000,.1):0;last=t;if(!paused){s.alt=P.clamp(s.alt+s.vsi/60*dt*10,0,12000);s.heading=P.norm(s.heading+P.turnRate(s.bank,s.speed)*dt*10);}const sensed=P.sensed(s,m);const sensedRate=dt?(sensed.alt-prevAlt)/(dt*10)*60:0;prevAlt=sensed.alt;indVsi+=(P.clamp(sensedRate,-2500,2500)-indVsi)*Math.min(1,dt/1.3);const pitch=Math.atan2(s.vsi/60,s.speed*1.68781)*180/Math.PI;const vacOff=s.vacuum||rpm<600;if(vacOff!==lastVacOff){lastVacOff=vacOff;gyroAge=0;explain();}if(vacOff){gyroAge+=dt;const loss=P.clamp((gyroAge-2)/12,0,1);gyroBank+=((s.bank+loss*60)-gyroBank)*dt*(1-loss)*3+loss*dt*2;gyroPitch+=(pitch-gyroPitch)*dt*(1-loss)*2;gyroHdg=P.norm(gyroHdg+P.turnRate(s.bank,s.speed)*dt*10*(1-loss)+loss*dt*2);}else{gyroBank+=(s.bank-gyroBank)*Math.min(1,dt*3);gyroPitch+=(pitch-gyroPitch)*Math.min(1,dt*3);gyroHdg=s.heading;}const target=running?P.engine(s).rpm:0;if(target===0)running=false;rpm+=(target-rpm)*Math.min(1,dt*2);acc+=dt;if(acc>.1){acc=0;render();}raf=requestAnimationFrame(frame);}
explain();plumbing();render();raf=requestAnimationFrame(frame);return()=>{disposed=true;cancelAnimationFrame(raf);};}
window.CampusCockpit={html,mount};})();

<script>
(function(){'use strict';window.VorLessons={
position:{title:'Leer el instrumento y encontrar el radial',page:'4 a 7',start:{x:12,y:-8,obs:270,heading:220},steps:[
['Separar posición y rumbo','El radial identifica la dirección magnética desde la estación hasta el avión. El rumbo indica hacia dónde apunta la nariz. Girar sin desplazarse cambia el rumbo, pero no el radial.','Compará RAD y HDG. El mapa está orientado al norte; la rosa del HSI gira con el rumbo.'],
['Encontrar una solución FROM','Con el vuelo pausado, mové OBS hasta centrar el CDI con bandera FROM. También podés usar Centrar radial FROM para comprobar tu lectura.','El curso seleccionado coincide con el radial de posición. En el HSI leé CRS, no la marca de rumbo superior.'],
['Encontrar la solución recíproca','Sumá o restá 180° al OBS. La barra vuelve a quedar centrada, pero la bandera cambia a TO.','Sobre radial 090, OBS 090 centra FROM y OBS 270 centra TO. Es la misma posición.'],
['Interpretar la bandera','TO y FROM relacionan el curso seleccionado con la estación. No indican por sí solos si el avión se está acercando o alejando: eso depende de su trayectoria.','Podés volar alejándote mientras conservás una selección TO. Observá el trazo y el DME.'],
['Leer la desviación','En este equipo, dos puntos por lado representan 10° a fondo de escala: cada punto representa 5°. La separación lateral correspondiente aumenta con la distancia a la estación.','CDI centrado significa estar sobre la línea de curso seleccionada, con la bandera que corresponda.'],
['Comparar VOR y HSI','El VOR convencional orienta la rosa según OBS. El HSI integra rumbo, flecha de curso y barra de desviación: el avión permanece fijo hacia arriba y la carta gira debajo.','Cambiar HDG gira la presentación HSI; cambiar OBS gira la flecha de curso. Ninguna acción traslada por sí sola el avión.']]},
outbound:{title:'Salida a menos de 90°',page:'8',start:{x:10,y:4,obs:90,heading:90},steps:[
['Definir el objetivo','Querés salir por radial 090. Comenzás al sureste, sobre un radial cercano a 112: la separación angular respecto del radial deseado es menor que 90°.','Activá cuadrantes y referencias. Ubicá la línea este desde la estación.'],
['Seleccionar curso de salida','Colocá OBS 090 y verificá FROM. El curso en salida coincide con el radial deseado; la posición exacta todavía no coincide con él.','CDI a la izquierda: el curso está al norte de tu trayectoria este.'],
['Elegir interceptación','Para esta geometría sin viento, probá rumbo 060: son 30° a la izquierda del curso de salida. El material propone 30° a 45° para este ejercicio.','Activá el vuelo y observá cómo se aproxima la barra al centro. No muevas OBS para perseguirla.'],
['Anticipar la captura','Iniciá el viraje a 090 antes de que la aguja cruce el centro. La referencia de un punto del manual es una ayuda didáctica, no una anticipación universal.','La anticipación depende de velocidad, régimen de giro, viento y distancia al VOR.'],
['Seguir el radial','Con CDI centrado y FROM, mantené el curso. Si agregás viento, ajustá el rumbo para compensar deriva, dejando OBS en 090.','El DME tiende a aumentar y el trazo se extiende hacia el este.']]},
outboundFar:{title:'Salida a más de 90° y cambio de cuadrante',page:'9 a 10',start:{x:-12,y:4,obs:90,heading:90},steps:[
['Reconocer el sector','El objetivo sigue siendo radial 090, pero empezás al suroeste. Con OBS 090 aparece TO: todavía estás del lado de entrada de esa línea de curso.','El límite TO/FROM se dibuja perpendicular al curso; no coincide siempre con los ejes norte y este.'],
['Avanzar hacia el sector de salida','Mantené rumbo 090 y OBS 090 en este ejemplo sin viento. No apliques todavía la corrección de interceptación como si estuvieras establecido en FROM.','Vas a cruzar el límite angular de sectores al pasar al este de la estación, no necesariamente por encima de ella.'],
['Esperar el cambio de bandera','Al cruzar el límite puede aparecer brevemente OFF en el modelo; después la bandera pasa de TO a FROM.','El cambio de bandera por sí solo no significa que el CDI esté centrado ni que hayas pasado sobre la estación.'],
['Interceptar desde el nuevo sector','Ya en FROM, el curso está a tu izquierda: usá rumbo 060 para converger con el radial 090. Si la geometría fuera inversa, la corrección sería hacia el otro lado.','Convergencia del trazo hacia la línea y CDI que se acerca al centro.'],
['Capturar y salir','Anticipá el viraje a 090 y mantené la aguja centrada. Conservá la selección FROM apropiada al seguimiento en salida.','El DME aumenta y la trayectoria queda sobre el radial de salida.']]},
inbound:{title:'Entrada a menos de 90°',page:'11',start:{x:12,y:4,obs:270,heading:270},steps:[
['Definir el radial de entrada','Querés ingresar por radial 090. Aunque la posición se llama radial 090, el curso para volarlo hacia el VOR es su recíproco: 270.','No selecciones 090 para volar inbound esperando TO.'],
['Seleccionar el recíproco','Colocá OBS 270 y verificá TO. Empezás al sur de la línea: el CDI indica que el curso queda a la derecha respecto de ese curso hacia el oeste.','Rumbo y curso todavía pueden coincidir sin estar sobre la línea correcta.'],
['Interceptar el curso','El manual practica interceptaciones de 90° y menciona 45°. En esta posición, rumbo 360 es una interceptación de 90° respecto de 270; 315 ofrece una convergencia de 45°.','Elegí una de las dos para comparar. A 90° hay menos avance hacia la estación y la captura exige anticipación.'],
['Virar a entrada','Cuando la barra comience a acercarse al centro, anticipá el viraje a 270. A mayor velocidad o cerca del VOR, el movimiento aparente del CDI es más rápido.','La barra se estabiliza cerca del centro y TO se mantiene.'],
['Mantener el ingreso','Corregí deriva con rumbo, sin mover la selección de curso. Reducir velocidad cambia la rapidez de la maniobra, pero no convierte el radial 090 en radial 270.','DME decreciente y trazo hacia la estación. Cerca de ella el CDI se vuelve muy sensible.']]},
inboundFar:{title:'Entrada a más de 90° y cambio de cuadrante',page:'12 a 13',start:{x:-12,y:4,obs:270,heading:90},steps:[
['Reconocer la geometría','Querés ingresar por radial 090, desde el lado oeste. OBS 270 selecciona la entrada, pero inicialmente muestra FROM.','El curso de entrada sigue siendo 270; primero necesitás colocarte en un sector desde el cual interceptarlo.'],
['Cruzar hacia el sector adecuado','En el ejemplo del material, tomá rumbo 090, igual al radial deseado, manteniendo OBS 270. Esto te lleva al este de la estación.','El HSI muestra nariz al este y flecha de curso al oeste: rumbo y curso son diferentes.'],
['Observar el cambio de bandera','Esperá que cambie de FROM a TO y comenzá a cronometrar el minuto didáctico propuesto por el manual.','Usá el reloj de vuelo simulado. Esta referencia de tiempo no reemplaza un procedimiento publicado.'],
['Seleccionar interceptación','Al terminar ese tramo, desde el sur de la línea podés tomar rumbo 360: 90° a la derecha del curso de entrada 270.','CDI a la derecha y trayectoria convergente hacia el curso.'],
['Capturar la entrada','Anticipá el viraje a 270 cuando el CDI se acerque al centro. Mantené TO y verificá que el DME disminuya.','Si sobrepasás el curso, reducís el ángulo y volvés a interceptar; no confundas esa corrección con cambiar el radial objetivo.']]},
reversal:{title:'Inversión OACI de 45° y 180°',page:'14 a 15',start:{x:8,y:0,obs:90,heading:90},steps:[
['Estar establecido','Comenzás saliendo por radial 090, OBS 090 y FROM. El objetivo es volver a ingresar por ese mismo radial, con curso 270.','El ejercicio comienza al este de la estación, sin viento.'],
['Separarse 45°','Para la versión que inicia por izquierda, virá a rumbo 045. Elegir derecha implica reflejar todos los virajes del ejercicio.','La trayectoria se separa hacia el norte del radial.'],
['Cronometrar el tramo','Con alas niveladas, mantené 045 durante un minuto de práctica, como en el material. Controlá el reloj simulado, no el tiempo de tu computadora.','La distancia recorrida en ese minuto depende de la velocidad sobre el suelo.'],
['Hacer el viraje contrario','Virá 180° a la derecha hasta rumbo 225. Cambiá OBS a 270 para preparar la entrada y verificá TO.','El rumbo 225 forma un ángulo de 45° con el curso de entrada 270.'],
['Capturar el regreso','Aproximándote al curso, anticipá el viraje a 270 y centrá el CDI.','El radial de posición vuelve a ser 090 mientras el curso de vuelo hacia la estación es 270.'],
['Verificar el procedimiento real','La carta y la autorización determinan lado, tiempos, altitudes, límites y si corresponde hacer una inversión. El término OACI del material no autoriza una maniobra genérica en cualquier aproximación.','Usá esta práctica para entender la geometría, sin trasladar sus tiempos a una operación real.']]},
teardrop:{title:'Inversión en gota',page:'16',start:{x:8,y:0,obs:90,heading:90},steps:[
['Preparar la inversión','Partís establecido en salida por radial 090. El objetivo es volver por el mismo radial con curso 270.','OBS 090, FROM y CDI centrado.'],
['Separarse 30°','En esta variante, virá 30° a la izquierda hasta rumbo 060. Mantené ese tramo durante el minuto de práctica propuesto por el material.','Se forma el primer lado de la gota, al norte del radial.'],
['Regresar con viraje opuesto','Iniciá un viraje a la derecha para volver hacia el curso de entrada. Prepará OBS 270 y TO; no basta con seleccionar el rumbo recíproco para quedar centrado.','Elegí el rumbo de interceptación observando posición, CDI y evolución del trazo.'],
['Capturar el curso','Anticipá la nivelación al acercarte al centro del CDI y estabilizá el ingreso en curso 270.','El tamaño y el cierre de la gota varían con velocidad, régimen de giro y viento. El minuto es didáctico.']]},
reverse90270:{title:'Inversión de 90° y 270°',page:'17',start:{x:8,y:0,obs:90,heading:90},steps:[
['Comenzar sobre el radial','Salida por radial 090, OBS 090 y FROM. Querés invertir para ingresar por el mismo radial.','Sin viento y con la misma velocidad en ambos virajes, los radios de giro pueden compararse en el mapa.'],
['Primer viraje de 90°','Virá 90° a la izquierda hasta rumbo 360 y nivelá las alas.','El primer arco termina al norte del curso inicial.'],
['Segundo viraje opuesto de 270°','Iniciá un viraje de 270° a la derecha hasta rumbo 270. Seleccioná OBS 270 y confirmá TO.','Vigilá el rumbo y el CDI; el viento y un cambio de velocidad alteran el cierre geométrico.'],
['Establecer el ingreso','Terminá nivelado y sobre el curso, corrigiendo la interceptación si fuera necesario.','El rumbo final es el recíproco del inicial. El radial de posición sigue siendo el mismo si el avión quedó sobre la misma semirrecta desde el VOR.']]}
,reverse80260:{title:'Adicional 80° y 260°',source:'Referencia complementaria · FAA Instrument Flying Handbook · inversiones de curso',start:{x:8,y:0,obs:90,heading:90},steps:[

['Viraje contrario de 260°','Al completar el primer viraje, comenzá el viraje de 260° a la izquierda para terminar en rumbo 270. Prepará OBS 270 y verificá TO.','Terminar en rumbo recíproco no garantiza que estés centrado sobre la línea de entrada.'],

function aeroHtml(){return `<div class="sim-layout aero-layout"><section class="card"><div class="section-heading"><h2>Flujo sobre el perfil</h2><button class="button secondary small" id="flow-toggle">Pausar flujo</button></div><svg id="aero-map" viewBox="0 0 760 440" role="img" aria-label="Perfil alar con borde de ataque a la izquierda y flujo de izquierda a derecha"></svg><div class="readings"><div>Ángulo de ataque<strong id="aero-alpha">8°</strong></div><div>Coeficiente de sustentación<strong id="aero-cl">—</strong></div><div>Coeficiente de resistencia<strong id="aero-cd">—</strong></div></div></section><section class="card"><h2>Configuración</h2>${range('alpha','Ángulo de ataque',-4,24,8)}${range('airspeed','Velocidad relativa',40,140,80,' kt')}${range('flap','Flaps',0,20,0)}<div class="flow-state" id="flow-state"></div><section id="aero-explain" aria-live="polite"><h3>Qué ocurre y por qué</h3></section><dl class="simple-facts"><div><dt>Borde de ataque</dt><dd>Izquierda</dd></div><div><dt>Flujo relativo</dt><dd>Izquierda → derecha</dd></div><div><dt>Modelo</dt><dd>Esquemático · no es CFD</dd><dt>Ángulo crítico del modelo</dt><dd>15° fijo</dd></div></dl></section></div>`;}
function mountAero(root){const $=id=>root.querySelector('#'+id);let raf,last=0,phase=0,paused=false,disposed=false,paths=[],particles=[],activeExplanation='airspeed';
function draw(event){if(event?.target?.id)activeExplanation=event.target.id;const a=Number($('alpha').value),v=Number($('airspeed').value),f=Number($('flap').value),r=C.aero(a,v,f);$('alpha-out').textContent=a+'°';$('airspeed-out').textContent=v+' kt';$('flap-out').textContent=f+'°';$('aero-alpha').textContent=a+'°';$('aero-cl').textContent=r.cl.toFixed(2);$('aero-cd').textContent=r.cd.toFixed(3);$('flow-state').textContent=r.stall?'Ángulo crítico superado · separación del flujo':'Flujo previo al ángulo crítico';$('flow-state').classList.toggle('separated',r.stall);const q=.5*1.225*(v*.514444)**2,ratio=(v/80)**2;const explainAlpha=r.stall?'La capa límite ya no sigue una parte importante del contorno superior. La separación reduce el coeficiente de sustentación y eleva mucho la resistencia. La pérdida no significa que desaparezca toda la sustentación. Aumentar velocidad manteniendo este ángulo no elimina la condición de pérdida del modelo.':a<0?'Reduciste el ángulo entre cuerda y viento relativo. El coeficiente de sustentación disminuye y puede volverse negativo; por eso también puede cambiar el sentido de la fuerza. La actitud de nariz respecto del horizonte, por sí sola, no define este ángulo.':'Antes del ángulo crítico, un aumento del ángulo modifica la distribución de presión y desvía más el flujo: crece el coeficiente de sustentación. También aumenta la resistencia asociada a esa sustentación. Bajar el ángulo produce el efecto opuesto.';
$('aero-explain').innerHTML=`<h3>Qué hace cada control</h3><details ${activeExplanation==='airspeed'?'open':''}><summary>Velocidad relativa · ${v} kt</summary><p>Es la velocidad del aire respecto del perfil, no la velocidad del avión sobre el suelo. Al subirla pasan más partículas de aire por unidad de tiempo y cada porción cambia más cantidad de movimiento al desviarse. Las partículas del dibujo avanzan más rápido.</p><p>Con la densidad, el área, el ángulo y los flaps constantes, sustentación y resistencia dependen del cuadrado de la velocidad. A ${v} kt, las fuerzas valen <b>${ratio.toFixed(2)} veces</b> las de 80 kt con esta misma configuración. La presión dinámica es aproximadamente <b>${Math.round(q)} Pa</b>.</p><p>Ejemplos: 40 → 80 kt duplica la velocidad y multiplica por 4 las fuerzas; 80 → 120 kt aumenta la velocidad 50 % y las fuerzas 125 %. Si bajás de 80 a 40 kt, queda una cuarta parte de la fuerza a igual coeficiente.</p><p>En un avión real que deba mantener vuelo recto y nivelado a menor velocidad, hay que aumentar el coeficiente de sustentación —normalmente con más ángulo de ataque— y ajustar potencia. Acercarse al ángulo crítico reduce el margen. Este control aísla la velocidad: no simula automáticamente esa compensación.</p></details><details ${activeExplanation==='alpha'?'open':''}><summary>Ángulo de ataque · ${a}°</summary><p>${explainAlpha}</p><p>La cuerda es la referencia geométrica entre los bordes del perfil. El viento relativo está dibujado de izquierda a derecha. El borde de ataque queda a la izquierda; al aumentar el ángulo positivo se eleva respecto del borde de salida.</p><p>El crítico se fija en 15° en esta práctica. En una aeronave real varía con el perfil y la configuración: no hay un ángulo ni una velocidad de pérdida universales para todos los aviones.</p></details><details ${activeExplanation==='flap'?'open':''}><summary>Flaps · ${f}°</summary><p>${f?'El borde de salida se desvía hacia abajo: aumenta la curvatura del perfil y se modifica el flujo. A igual velocidad y ángulo, este modelo aumenta el coeficiente de sustentación y agrega resistencia.':'Retractados: el perfil conserva su curvatura base. Al extenderlos, observá el desplazamiento del borde de salida y el cambio de coeficientes.'}</p><p>Por eso los flaps pueden ayudar a sostener el peso a menor velocidad, pero también aumentan la resistencia y requieren considerar potencia y trayectoria. Retractarlos sin compensar puede reducir momentáneamente la sustentación. El límite VFE y las posiciones permitidas corresponden al manual de cada avión.</p><p>Según el tipo, algunos flaps aumentan también el área. Aquí se modifica la curvatura de forma esquemática y se conserva el área de referencia.</p></details><details><summary>Cómo leer CL, CD y el flujo</summary><p>CL mide cuánta sustentación produce esta forma y este ángulo para una presión dinámica y área dadas; CD hace lo mismo para la resistencia. Son coeficientes sin unidades. Más velocidad cambia las fuerzas aunque los coeficientes permanezcan iguales.</p><p>Relaciones: L = q × S × CL; D = q × S × CD; q = ½ × densidad × velocidad². L actúa perpendicular al viento relativo y D paralela a él, oponiéndose al movimiento del avión a través del aire.</p><p>Los índices comparan fuerzas con una referencia fija: sustentación ${r.liftIndex.toFixed(2)} y resistencia ${r.dragIndex.toFixed(2)}. No son kilogramos ni newtons de un avión concreto. La separación se dibuja como una estela irregular; las líneas y partículas son una visualización, no una solución CFD ni una medición exacta de velocidades locales.</p></details><p class="lesson-source">Referencia conceptual: NASA Glenn · Lift Equation y Velocity Effects; FAA · Pilot’s Handbook of Aeronautical Knowledge.</p>`;
const rad=a*Math.PI/180,fr=f*Math.PI/180;function transform(x,y){if(x>435){const dx=x-435,dy=y-220;x=435+dx*Math.cos(fr)-dy*Math.sin(fr);y=220+dx*Math.sin(fr)+dy*Math.cos(fr);}const dx=x-340,dy=y-220;return [340+dx*Math.cos(rad)-dy*Math.sin(rad),220+dx*Math.sin(rad)+dy*Math.cos(rad)];}
const upper=[],lower=[];for(let i=0;i<=40;i++){const t=i/40,x=195+285*t,th=5*.13*285*(.2969*Math.sqrt(t)-.126*t-.3516*t*t+.2843*t**3-.1036*t**4),camber=12*Math.sin(Math.PI*t);upper.push(transform(x,220-camber-th));lower.push(transform(x,220-camber+th));}const hull=[...upper,...lower.reverse()],foil='M'+hull.map(p=>p.join(' ')).join('L')+'Z';
function bounds(x){const ys=[];for(let i=0;i<hull.length;i++){const a=hull[i],b=hull[(i+1)%hull.length];if((a[0]<=x&&b[0]>x)||(b[0]<=x&&a[0]>x))ys.push(a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]));}return ys.length?[Math.min(...ys),Math.max(...ys)]:null;}
const lines=[50,85,120,155,190,250,285,320,355,390].map((y,i)=>{const top=i<5;const pts=[];for(let x=0;x<=760;x+=5){const b=bounds(x);let yy=y;if(b)yy=top?Math.min(y,b[0]-15-(4-i)*6):Math.max(y,b[1]+15+(i-5)*6);if(r.stall&&top&&x>490)yy+=Math.sin((x-490)/25+i)*Math.min(25,(x-490)/4);pts.push([x,yy]);}return `<path class="streamline" d="M${pts.map(p=>p.join(' ')).join('L')}" fill="none" stroke="${r.stall&&top?'#b17c42':'#96acbd'}" stroke-width="1.2"/>`;}).join('');
$('aero-map').innerHTML=`<defs><linearGradient id="airfoil-metal" x2="0" y2="1"><stop stop-color="#637d90"/><stop offset="1" stop-color="#d1dbe2"/></linearGradient></defs><rect width="760" height="440" fill="#f8fafc"/><path d="M25 30h95m-9-5 9 5-9 5" stroke="#3c5e78" fill="none" stroke-width="2"/><text x="135" y="35" fill="#4b6477" font-size="12">VIENTO RELATIVO</text>${lines}<path id="foil-transform" d="${foil}" fill="url(#airfoil-metal)" stroke="#345167" stroke-width="2"/><path d="M${transform(195,220).join(' ')}L${transform(480,220).join(' ')}" stroke="#243f54" stroke-dasharray="6 5"/><path d="${r.liftIndex>=0?'M340 146v-60m-6 10 6-10 6 10':'M340 285v60m-6-10 6 10 6-10'}" stroke="#2a668b" stroke-width="2" fill="none"/><text x="353" y="${r.liftIndex>=0?100:340}" fill="#2a668b" font-size="12">L</text><text x="170" y="412" fill="#4e6577" font-size="12">BORDE DE ATAQUE</text><text x="475" y="412" fill="#4e6577" font-size="12">BORDE DE SALIDA</text>${Array.from({length:40},(_,i)=>`<circle class="flow-particle" r="2.8" fill="${r.stall&&i%10<5?'#a96731':'#2c6a96'}"/>`).join('')}`;paths=[...$('aero-map').querySelectorAll('.streamline')];particles=[...$('aero-map').querySelectorAll('.flow-particle')];position();}
function position(){particles.forEach((p,i)=>{const path=paths[i%paths.length],length=path.getTotalLength(),point=path.getPointAtLength(((phase+(Math.floor(i/paths.length)/5))%1)*length);p.setAttribute('cx',point.x);p.setAttribute('cy',point.y);});}
function frame(t){if(disposed)return;if(last&&!paused){phase=(phase+Math.min((t-last)/1000,.1)*Number($('airspeed').value)/500)%1;position();}last=t;raf=requestAnimationFrame(frame);}['alpha','airspeed','flap'].forEach(id=>$(id).oninput=draw);$('flow-toggle').onclick=()=>{paused=!paused;$('flow-toggle').textContent=paused?'Reanudar flujo':'Pausar flujo';};draw();raf=requestAnimationFrame(frame);return()=>{disposed=true;cancelAnimationFrame(raf);};}
window.CampusSim={html:type=>type==='vor'?vorHtml():type==='cockpit'?window.CampusCockpit.html():aeroHtml(),mount:(type,root)=>type==='vor'?mountVor(root):type==='cockpit'?window.CampusCockpit.mount(root):mountAero(root)};})();

</script>
<script>
(function(){'use strict';let A;const $=s=>document.querySelector(s);function init(context){A=context;}const e=v=>A.esc(v),cNow=()=>A.course(A.route()[2]);
const field=(label,name,value='',type='text',extra='')=>`<label>${e(label)}<input name="${name}" type="${type}" value="${e(value)}" ${extra}></label>`;
const area=(label,name,value='',extra='')=>`<label>${e(label)}<textarea name="${name}" ${extra}>${e(value)}</textarea></label>`;
const select=(label,name,options,value)=>`<label>${e(label)}<select name="${name}">${options.map(([v,t])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${e(t)}</option>`).join('')}</select></label>`;
const status=()=>'<div class="form-status" role="status"></div>';
const saveButton=text=>`<button type="submit" class="button">${e(text||'Guardar')}</button>`;
function tabs(){const r=A.route();return `<div class="tabs">${[['','Alumnos'],['contenidos','Contenidos'],['entregas','Trabajos prácticos'],['llamadas','Solicitudes de llamada'],['usuarios','Usuarios y accesos'],['configuracion','Configuración']].map(([path,t])=>`<a href="#/admin${path?'/'+path:''}" class="${(r[1]||'')===path?'active':''}">${t}</a>`).join('')}</div>`;}
function students(){const list=A.S.admin.students.filter(x=>x.profile.role==='student');return `${A.heading('Administración académica','Seguimiento de alumnos.','<div class="row wrap">'+A.button('Actualizar','refresh-admin','',true)+A.button('Exportar seguimiento','export-students','',true)+'</div>')}${tabs()}<section class="card"><div class="section-heading"><h2>Alumnos</h2><input id="admin-search" type="search" aria-label="Buscar alumno" placeholder="Buscar alumno"></div><div class="table-scroll"><table><thead><tr><th>Alumno</th><th>Materias aprobadas</th><th>Evaluaciones</th><th>Trabajos pendientes</th><th></th></tr></thead><tbody>${list.map(({profile,record})=>{const subs=A.S.admin.submissions.filter(s=>s.user_id===profile.id),n=A.S.courses.filter(c=>A.C.completed(record,c,subs)).length;return `<tr data-student-name="${e(profile.full_name.toLowerCase())}"><td><strong>${e(profile.full_name)}</strong>${profile.email?'<small>'+e(profile.email)+'</small>':''}</td><td>${n}/${A.S.courses.length}</td><td>${record.attempts.filter(a=>a.mode==='exam').length}</td><td>${subs.filter(s=>s.status==='pending').length}</td><td><a href="#/admin/alumno/${profile.id}">Ver ficha →</a></td></tr>`;}).join('')}</tbody></table></div>${!list.length?'<p class="muted">No hay alumnos registrados.</p>':''}</section>`;}
function studentView(){const entry=A.S.admin.students.find(x=>x.profile.id===A.route()[2]);if(!entry)return A.heading('Alumno no encontrado');const {profile,record}=entry,subs=A.S.admin.submissions.filter(x=>x.user_id===profile.id);return `<a class="back-link" href="#/admin">← Alumnos</a>${A.heading(profile.full_name)}<section class="card"><div class="table-scroll"><table><thead><tr><th>Materia</th><th>Lecturas</th><th>Controles</th><th>TP</th><th>Evaluación</th><th>Estado</th></tr></thead><tbody>${A.S.courses.map(c=>{const t=A.C.training(record,c,subs);return `<tr><td>${e(c.short)}</td><td>${t.done}/${c.lessons.length}</td><td>${t.passed}/${c.lessons.length}</td><td>${t.tp?'Aprobado':t.submission?.status==='pending'?'En revisión':'Pendiente'}</td><td>${A.C.best(record,c,'exam')}%</td><td>${A.C.completed(record,c,subs)?'Aprobada':'Pendiente'}</td></tr>`;}).join('')}</tbody></table></div></section><div class="section-heading"><h2>Historial</h2></div><section class="card">${A.history(record)}</section>`;}
function contents(){return `${A.heading('Contenidos académicos','Materias, materiales, lecciones y banco de preguntas.')}${tabs()}<section class="card">${A.S.courses.map((c,i)=>`<div class="lesson-row"><span class="step">${i+1}</span><div><h3>${e(c.title)}</h3><small>${c.lessons.length} lecciones · ${c.questions.length} preguntas</small></div>${A.link('Administrar','admin/materia/'+c.id,true)}</div>`).join('')}</section>`;}
function courseNav(c,active){return `<a class="back-link" href="#/admin/contenidos">← Contenidos</a>${A.heading(c.title)}<div class="tabs">${[['general','Configuración'],['fuentes','Fuentes'],['lecciones','Lecciones'],['preguntas','Preguntas'],['trabajo','Trabajo práctico']].map(([t,label])=>`<a href="#/admin/materia/${c.id}/${t}" class="${active===t?'active':''}">${label}</a>`).join('')}</div>`;}
function courseView(){const c=cNow();if(!c)return A.heading('Materia no encontrada');const tab=A.route()[3]||'general';let body='';
if(tab==='general')body=`<form id="admin-course" class="form-stack"><div class="two-columns">${field('Nombre de la materia','title',c.title,'text','required maxlength="160"')}${field('Nombre breve','short',c.short,'text','required maxlength="60"')}</div>${area('Descripción','description',c.description,'required maxlength="1000"')}<div class="two-columns">${field('Porcentaje de aprobación de evaluación','pass',c.pass,'number','min="1" max="100" required')}${field('Porcentaje de aprobación de controles','lessonPass',c.lessonPass,'number','min="1" max="100" required')}${field('Preguntas de la evaluación','examCount',c.examCount,'number','min="1" max="200" required')}${field('Duración de la evaluación (minutos)','examMinutes',c.examMinutes,'number','min="1" max="300" required')}</div>${saveButton()}${status()}</form>`;
if(tab==='fuentes')body=`<h2>Fuentes de estudio</h2><div class="resource-list">${c.sources.map(s=>`<div><span><strong>${e(s.title)}</strong><small>${e(s.asset?.name||s.url)}</small></span>${A.button('Eliminar','delete-source',`data-course="${c.id}" data-id="${s.id}"`,true)}</div>`).join('')}</div><h3 class="space-top">Agregar fuente</h3><form id="admin-source" class="form-stack">${field('Título','title','','text','required maxlength="200"')}${area('Descripción','description')}${field('Enlace de consulta','url','','url')}<label>O adjuntar archivo<input type="file" name="file" accept=".pdf,.docx,.xlsx,.txt,.png,.jpg,.jpeg,.webp"></label>${saveButton('Agregar fuente')}${status()}</form>`;
if(tab==='lecciones')body=`<div class="section-heading"><h2>Lecciones</h2>${A.link('Agregar lección','admin/leccion/'+c.id+'/nueva')}</div>${c.lessons.map((l,i)=>`<div class="lesson-row"><span class="step">${i+1}</span><div><h3>${e(l.title)}</h3><small>${l.minutes} min · ${l.checkpoints?.length||0} controles de video</small></div><div class="row wrap">${A.button('↑','move-lesson',`data-course="${c.id}" data-id="${l.id}" data-dir="-1"`,true)}${A.button('↓','move-lesson',`data-course="${c.id}" data-id="${l.id}" data-dir="1"`,true)}${A.link('Editar','admin/leccion/'+c.id+'/'+l.id,true)}${A.button('Eliminar','delete-lesson',`data-course="${c.id}" data-id="${l.id}"`,true)}</div></div>`).join('')}`;
if(tab==='preguntas')body=`<div class="section-heading"><h2>Banco de preguntas</h2><div class="row">${A.button('Exportar banco','export-bank',`data-course="${c.id}"`,true)}${A.link('Agregar pregunta','admin/pregunta/'+c.id+'/nueva')}</div></div><div class="row filter-row"><input id="question-search" type="search" placeholder="Buscar enunciado" aria-label="Buscar pregunta"><select id="question-type-filter" aria-label="Filtrar formato"><option value="">Todos los formatos</option>${Object.entries(A.Q.names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="question-bank">${c.questions.map(q=>`<div data-bank-type="${q.type}" data-bank-prompt="${e(q.prompt.toLowerCase())}"><section><span class="label">${A.Q.names[q.type]}</span><h3>${e(q.prompt)}</h3><small>${e(c.lessons.find(l=>l.id===q.lesson)?.title||'Sin lección')} · ${q.purpose==='both'?'Estudio y evaluación':q.purpose==='practice'?'Estudio':'Evaluación'}</small></section><div class="row">${A.link('Editar','admin/pregunta/'+c.id+'/'+q.id,true)}${A.button('Eliminar','delete-question',`data-course="${c.id}" data-id="${q.id}"`,true)}</div></div>`).join('')}</div>`;
if(tab==='trabajo')body=`<form id="admin-work" class="form-stack">${area('Consigna del trabajo práctico','instructions',c.tp.instructions,'required')}<label class="inline"><input name="required" type="checkbox" ${c.tp.required?'checked':''}>Requiere aprobación del docente para habilitar la evaluación</label><label>Archivo de consigna<input name="file" type="file" accept=".pdf,.docx,.xlsx,.txt,.png,.jpg,.jpeg,.webp"></label>${c.tp.asset?`<p>Archivo actual: ${e(c.tp.asset.name)}</p><label class="inline"><input type="checkbox" name="removeAsset">Quitar archivo actual</label>`:''}${saveButton()}${status()}</form>`;
return courseNav(c,tab)+`<section class="card">${body}</section>`;}
function checkpointRow(cp,c){return `<div class="checkpoint-editor" data-checkpoint="${e(cp.id||A.uid())}">${field('Segundo del video','checkpointTime',cp.time??0,'number','min="0" step="1" required')}${select('Pregunta','checkpointQuestion',c.questions.map(q=>[q.id,q.prompt.slice(0,100)]),cp.questionId)}<button type="button" class="button secondary" data-action="remove-checkpoint">Quitar</button></div>`;}
function lessonEditor(){const c=cNow();if(!c)return A.heading('Materia no encontrada');const l=c.lessons.find(x=>x.id===A.route()[3])||{id:'',title:'',minutes:5,body:[],takeaway:'',checkpoints:[]};return `<a class="back-link" href="#/admin/materia/${c.id}/lecciones">← Lecciones</a>${A.heading(l.id?'Editar lección':'Agregar lección',c.short)}<section class="card"><form id="admin-lesson" class="form-stack"><input type="hidden" name="id" value="${l.id}"><div class="two-columns">${field('Título','title',l.title,'text','required maxlength="200"')}${field('Duración estimada (minutos)','minutes',l.minutes,'number','min="1" max="600" required')}</div>${area('Estudio guiado','body',l.body.join('\n\n'),'required rows="12"')}${area('Concepto principal','takeaway',l.takeaway,'required')}<h3>Video de la lección</h3>${field('Enlace directo al video MP4 o WEBM','videoUrl',l.video?.url||'','url')}<label>O subir video<input type="file" name="videoFile" accept="video/mp4,video/webm"></label>${l.video?.path?`<p>Archivo actual: ${e(l.video.name)}</p>`:''}<label class="inline"><input type="checkbox" name="removeVideo">Quitar video</label><div class="section-heading"><h3>Preguntas durante el video</h3>${A.button('Agregar control','add-checkpoint',`data-course="${c.id}"`,true)}</div><div id="checkpoint-list">${(l.checkpoints||[]).map(cp=>checkpointRow(cp,c)).join('')}</div>${saveButton('Guardar lección')}${status()}</form></section>`;}
function typeFields(type,q={}){const existing=q.type===type?q:{};if(['mcq','multi','tf','metar','scenario'].includes(type)){const options=type==='tf'?['Verdadero','Falso']:existing.options||['','','',''];const checks=Array.isArray(existing.correct)?existing.correct:[existing.correct??0];return `<div id="option-rows">${options.map((text,i)=>optionRow(type,text,i,checks.includes(i))).join('')}</div>${type==='multi'?A.button('Agregar opción','add-option','',true):''}`;}
if(type==='number')return `<div class="three-columns">${field('Resultado correcto','answer',existing.answer??'','number','step="any" required')}${field('Tolerancia ±','tolerance',existing.tolerance??0,'number','min="0" step="any" required')}${field('Unidad','unit',existing.unit||'')}</div>`;
if(type==='instrument')return `<div class="two-columns">${select('Instrumento','instrumentKind',[['altimeter','Altímetro'],['horizon','Horizonte artificial · alabeo']],existing.instrument?.kind||'altimeter')}${field('Indicación correcta (ft o grados)','instrumentValue',existing.instrument?.value??3500,'number','step="any" required')}${field('Cabeceo del horizonte (grados)','pitch',existing.instrument?.pitch||0,'number','min="-30" max="30"')}${field('Tolerancia ±','tolerance',existing.tolerance??50,'number','min="0" step="any" required')}</div>`;
if(type==='order')return area('Pasos en el orden correcto · uno por renglón','items',(existing.items||[]).join('\n'),'required rows="7"');
if(type==='match')return `<div class="two-columns">${area('Conceptos · uno por renglón','pairLeft',(existing.pairs||[]).map(x=>x.left).join('\n'),'required rows="8"')}${area('Respuestas correspondientes · mismo orden','pairRight',(existing.pairs||[]).map(x=>x.right).join('\n'),'required rows="8"')}</div>`;
if(type==='hotspot')return `<label>Imagen del ejercicio<input type="file" name="imageFile" accept="image/png,image/jpeg,image/webp"></label>${field('O enlace de imagen','imageUrl',existing.image?.url||'','url')}${field('Descripción de la imagen','imageAlt',existing.imageAlt||'','text','required')}<div id="target-image" class="target-image">${existing.image?`<img ${existing.image.url?`src="${e(A.C.safeUrl(existing.image.url))}"`:`data-asset="${e(JSON.stringify(existing.image))}"`} alt="Vista para definir la respuesta"><span class="hotspot-dot" style="left:${existing.target?.x||50}%;top:${existing.target?.y||50}%"></span>`:''}</div><div class="three-columns">${field('Centro horizontal (%)','targetX',existing.target?.x??50,'number','min="0" max="100" step="0.1" required')}${field('Centro vertical (%)','targetY',existing.target?.y??50,'number','min="0" max="100" step="0.1" required')}${field('Radio de tolerancia (%)','targetRadius',existing.target?.radius??8,'number','min="1" max="50" step="0.1" required')}</div>`;return '';}
function optionRow(type,text,i,checked){return `<div class="option-editor"><input type="${type==='multi'?'checkbox':'radio'}" name="correct" value="${i}" aria-label="Opción ${i+1} correcta" ${checked?'checked':''}><input name="optionText" aria-label="Texto de opción ${i+1}" value="${e(text)}" ${type==='tf'?'readonly':''} placeholder="Opción ${i+1}">${type==='multi'&&i>1?A.button('Quitar','remove-option','',true):''}</div>`;}
function questionEditor(){const c=cNow();if(!c)return A.heading('Materia no encontrada');if(!c.lessons.length)return A.heading('Agregá una lección antes de cargar preguntas');const q=c.questions.find(q=>q.id===A.route()[3])||{id:'',type:'mcq',lesson:c.lessons[0].id,purpose:'both',prompt:'',explanation:''};return `<a class="back-link" href="#/admin/materia/${c.id}/preguntas">← Banco de preguntas</a>${A.heading(q.id?'Editar pregunta':'Agregar pregunta',c.short)}<section class="card"><form id="admin-question" class="form-stack"><input name="id" type="hidden" value="${q.id}"><div class="three-columns">${select('Formato','type',Object.entries(A.Q.names),q.type)}${select('Lección','lesson',c.lessons.map(l=>[l.id,l.title]),q.lesson)}${select('Disponible en','purpose',[['both','Estudio y evaluación'],['practice','Solo estudio'],['exam','Solo evaluación']],q.purpose)}</div>${area('Enunciado','prompt',q.prompt,'required rows="3"')}${area('Texto de apoyo, METAR o escenario','context',q.context||'','rows="3"')}<section id="question-type-fields">${typeFields(q.type,q)}</section>${area('Explicación de la respuesta','explanation',q.explanation,'required rows="4"')}<div class="row wrap">${saveButton('Guardar pregunta')}${A.button('Vista previa','preview-question','',true)}</div>${status()}<div id="question-preview"></div></form></section>`;}
function submissions(){const list=[...A.S.admin.submissions].sort((a,b)=>b.submitted_at.localeCompare(a.submitted_at));return `${A.heading('Trabajos prácticos')}${tabs()}<section class="card"><div class="section-heading"><h2>Entregas</h2><select id="submission-filter" aria-label="Filtrar entregas"><option value="">Todos los estados</option><option value="pending">En revisión</option><option value="changes">Requiere cambios</option><option value="approved">Aprobados</option></select></div>${list.map(s=>{const user=A.S.admin.students.find(x=>x.profile.id===s.user_id)?.profile;return `<article class="submission-review" data-submission-state="${s.status}"><div class="section-heading"><div><h3>${e(user?.full_name||s.user_id)} · ${e(A.course(s.course_id)?.short)}</h3><small>${dateSafe(s.submitted_at)} · ${e(s.asset.name)}</small></div>${A.tag(s.status==='pending'?'En revisión':s.status==='approved'?'Aprobado':'Requiere cambios',s.status==='approved'?'success':'')}</div>${s.note?`<p>${e(s.note)}</p>`:''}${A.button('Descargar archivo','open-submission',`data-id="${s.id}"`,true)}<form class="form-stack space-top" data-review-form="${s.id}"><div class="two-columns">${select('Resultado','status',[['approved','Aprobar'],['changes','Solicitar cambios']],s.status==='changes'?'changes':'approved')}${field('Calificación (%)','grade',s.grade??'','number','min="0" max="100"')}</div>${area('Devolución al alumno','feedback',s.feedback||'','maxlength="6000"')}${saveButton('Guardar corrección')}${status()}</form></article>`;}).join('')||'<p class="muted">No hay entregas registradas.</p>'}</section>`;}
function dateSafe(v){return A.date(v);}
function settingsView(){return `${A.heading('Configuración académica')}${tabs()}<form id="admin-settings" class="form-stack"><section class="card"><h2>Orden de las materias</h2><ol id="curriculum-order" class="order-list space-top">${A.S.courses.map(c=>`<li data-course-order="${c.id}"><span>${e(c.title)}</span><button type="button" class="icon-button" data-action="move-course" data-dir="-1">↑</button><button type="button" class="icon-button" data-action="move-course" data-dir="1">↓</button></li>`).join('')}</ol></section><section class="card"><h2>Examen final</h2><div class="three-columns space-top">${field('Cantidad de preguntas','finalCount',A.S.settings.finalCount,'number','min="1" max="300" required')}${field('Duración (minutos)','finalMinutes',A.S.settings.finalMinutes,'number','min="1" max="300" required')}${field('Porcentaje de aprobación','finalPass',A.S.settings.finalPass,'number','min="1" max="100" required')}</div></section>${saveButton('Guardar configuración')}${status()}</form>`;}

ace','new-invitation',`data-email="${e(p.email)}"`,true):''}${owner?(p.role==='admin'?A.button('Quitar administrador','set-user-role',`data-id="${p.id}" data-role="student"`,true):A.button('Dar administrador','set-user-role',`data-id="${p.id}" data-role="admin"`,true)):''}</div>`}</td></tr>`;}).join('')}</tbody></table></div></section>`;}

function callsView(){const op=A.S.operational;if(!A.repo.live)return `${A.heading('Solicitudes de llamada')}${tabs()}<section class="card"><p>Disponible al conectar Supabase.</p></section>`;if(!op)return `${A.heading('Solicitudes de llamada')}${tabs()}${A.button('Cargar solicitudes','load-operational')}`;
return `${A.heading('Solicitudes de llamada','Últimas 500 solicitudes.',''+A.button('Actualizar','load-operational','',true))}${tabs()}<section class="card">${op.calls.map(c=>`<article class="submission-review"><div class="section-heading"><h3>${e(c.full_name)}</h3>${A.tag(({new:'Nueva',contacted:'Contactada',closed:'Cerrada'})[c.status]||c.status)}</div><p>${e(c.email)} · ${e(c.phone)}</p><p>${e(c.preferred_time)} · ${dateSafe(c.created_at)}</p><p>${e(c.message)}</p><div class="row wrap">${[['new','Nueva'],['contacted','Contactada'],['closed','Cerrar']].map(([status,label])=>A.button(label,'call-status',`data-id="${c.id}" data-status="${status}"`,true)).join('')}</div></article>`).join('')||'<p>No hay solicitudes.</p>'}</section>`;}
function mailsView(){const op=A.S.operational;return `${A.heading('Avisos por correo','Pendiente: en cola. Enviado: aceptado por el servicio de correo; no garantiza lectura.')}${tabs()}${A.repo.live?A.button('Actualizar','load-operational','',true):''}<section class="card">${!A.repo.live?'<p>Disponible al conectar Supabase.</p>':!op?'<p>Actualizá para consultar los avisos.</p>':op.mail.map(m=>`<article class="submission-review"><strong>${e(({welcome:'Bienvenida',login:'Ingreso',course:'Materia completada',call_admin:'Nueva consulta',call_receipt:'Recepción de consulta'})[m.kind]||m.kind)}</strong><p>${e(m.recipient||'Administración')} · ${e(({pending:'Pendiente',sending:'En proceso',sent:'Enviado',failed:'Falló'})[m.status]||m.status)} · ${dateSafe(m.created_at)}</p>${m.last_error?'<p>'+e(m.last_error)+'</p>':''}</article>`).join('')||'<p>No hay avisos.</p>'}</section>`;}

function view(){switch(A.route()[1]){case 'contenidos':return contents();case 'materia':return courseView();case 'leccion':return lessonEditor();case 'pregunta':return questionEditor();case 'entregas':return submissions();case 'llamadas':return callsView();case 'usuarios':return usersView();case 'configuracion':return settingsView();case 'alumno':return studentView();default:return students();}}
async function collectQuestion(form,upload=false){const fd=new FormData(form),d=Object.fromEntries(fd),c=cNow(),old=c.questions.find(x=>x.id===d.id),type=d.type,q={id:d.id||A.uid(),type,lesson:d.lesson,purpose:d.purpose,prompt:d.prompt.trim(),context:d.context.trim(),explanation:d.explanation.trim()};
if(['mcq','tf','multi','metar','scenario'].includes(type)){const texts=fd.getAll('optionText').map(x=>x.trim()),chosen=fd.getAll('correct').map(Number),keep=texts.map((text,i)=>({text,i})).filter(x=>x.text);q.options=keep.map(x=>x.text);const indices=chosen.map(i=>keep.findIndex(x=>x.i===i));if(indices.some(i=>i<0))throw Error('La opción correcta no puede estar vacía.');q.correct=type==='multi'?indices:indices[0];}
if(type==='number'){q.answer=Number(d.answer);q.tolerance=Number(d.tolerance);q.unit=d.unit.trim();}
if(type==='instrument'){q.instrument={kind:d.instrumentKind,value:Number(d.instrumentValue),pitch:Number(d.pitch)};q.answer=q.instrument.value;q.tolerance=Number(d.tolerance);q.unit=q.instrument.kind==='altimeter'?'ft':'°';if(q.instrument.kind==='altimeter'&&(q.answer<0||q.answer>=10000))throw Error('Este altímetro muestra valores entre 0 y 9999 ft.');if(q.instrument.kind==='horizon'&&Math.abs(q.answer)>60)throw Error('El horizonte admite alabeo entre −60° y 60°.');}
if(type==='order')q.items=d.items.split('\n').map(x=>x.trim()).filter(Boolean);
if(type==='match'){const left=d.pairLeft.split('\n').map(x=>x.trim()).filter(Boolean),right=d.pairRight.split('\n').map(x=>x.trim()).filter(Boolean);if(left.length!==right.length)throw Error('Las dos columnas deben tener la misma cantidad de renglones.');q.pairs=left.map((left,i)=>({left,right:right[i]}));}
if(type==='hotspot'){const file=form.querySelector('[name=imageFile]').files[0];if(file&&!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('La imagen debe ser PNG, JPG o WEBP.');q.image=file?{path:'pending'}:d.imageUrl?{url:A.C.safeUrl(d.imageUrl)}:old?.image;if(!q.image||q.image.url==='')throw Error('Cargá una imagen válida.');q.imageAlt=d.imageAlt;q.target={x:Number(d.targetX),y:Number(d.targetY),radius:Number(d.targetRadius)};A.C.validate(q,c);if(file&&upload)q.image=await A.repo.upload(A.S.user,file,'materials',c.id);if(file&&!upload)q.image={url:URL.createObjectURL(file)};}
return A.C.validate(q,c);}
async function action(el){const c=A.course(el.dataset.course)||cNow(),act=el.dataset.action;switch(act){
case 'reload-users':A.S.admin=await A.repo.all();await A.render();break;
case 'set-user-access':{const status=el.dataset.status;if(!confirm(status==='active'?'¿Habilitar el acceso de esta cuenta? Confirmá que el pago o la autorización ya fueron revisados.':'¿Suspender el acceso? El progreso se conserva.'))return;await A.repo.manageAccess(el.dataset.id,status);A.S.admin=await A.repo.all();A.S.invitation=null;await A.render();A.notify('Acceso actualizado.');break;}
case 'set-user-role':{if(A.S.user.role!=='owner')throw Error('Solo el propietario puede cambiar roles.');if(!confirm(el.dataset.role==='admin'?'¿Otorgar permisos de administrador y habilitar esta cuenta?':'¿Quitar los permisos de administrador? Su acceso quedará suspendido hasta que lo habilites como alumno.'))return;await A.repo.manageRole(el.dataset.id,el.dataset.role);A.S.admin=await A.repo.all();A.S.invitation=null;await A.render();A.notify('Rol actualizado.');break;}
case 'new-invitation':{if(!confirm('¿Generar un nuevo enlace personal? El anterior puede dejar de funcionar.'))return;A.S.invitation=await A.repo.invitation(el.dataset.email);await A.render();break;}
case 'copy-invitation':{const text=A.S.invitation?.link;if(!text)throw Error('No hay un enlace disponible.');try{await navigator.clipboard.writeText(text);A.notify('Enlace copiado.');}catch{throw Error('Seleccioná el enlace y copialo con ⌘C o Ctrl+C.');}break;}
case 'close-invitation':A.S.invitation=null;await A.render();break;

case 'load-operational':A.S.operational=await A.repo.operational();await A.render();break;
case 'call-status':await A.repo.callStatus(el.dataset.id,el.dataset.status);A.S.operational=await A.repo.operational();await A.render();break;
case 'delete-source':if(!confirm('¿Quitar esta fuente de la materia?'))return;{const n=A.clone(c);n.sources=n.sources.filter(x=>x.id!==el.dataset.id);await A.saveCourse(n);await A.render();break;}
case 'delete-question':if(!confirm('¿Eliminar esta pregunta del banco? Los intentos anteriores se conservan.'))return;{const n=A.clone(c);n.questions=n.questions.filter(x=>x.id!==el.dataset.id);n.lessons.forEach(l=>l.checkpoints=l.checkpoints.filter(x=>x.questionId!==el.dataset.id));await A.saveCourse(n);await A.render();break;}
case 'delete-lesson':if(c.lessons.length<=1)throw Error('Debe quedar al menos una lección.');if(!confirm('¿Eliminar la lección y sus preguntas?'))return;{const n=A.clone(c);n.lessons=n.lessons.filter(x=>x.id!==el.dataset.id);n.questions=n.questions.filter(x=>x.lesson!==el.dataset.id);await A.saveCourse(n);await A.render();break;}
case 'move-lesson':{const n=A.clone(c),i=n.lessons.findIndex(x=>x.id===el.dataset.id),j=i+Number(el.dataset.dir);if(j<0||j>=n.lessons.length)return;[n.lessons[i],n.lessons[j]]=[n.lessons[j],n.lessons[i]];await A.saveCourse(n);await A.render();break;}
case 'move-course':{const li=el.closest('li'),other=Number(el.dataset.dir)<0?li.previousElementSibling:li.nextElementSibling;if(other)Number(el.dataset.dir)<0?li.parentNode.insertBefore(li,other):li.parentNode.insertBefore(other,li);break;}
case 'add-checkpoint':if(!c.questions.length)throw Error('Cargá una pregunta antes de agregar un control.');$('#checkpoint-list').insertAdjacentHTML('beforeend',checkpointRow({},c));break;
case 'remove-checkpoint':el.closest('.checkpoint-editor').remove();break;
case 'add-option':{const rows=$('#option-rows');if(rows.children.length>=8)throw Error('Se admiten hasta ocho opciones.');rows.insertAdjacentHTML('beforeend',optionRow('multi','',rows.children.length,false));break;}
case 'remove-option':{el.closest('.option-editor').remove();$('#option-rows').querySelectorAll('[name=correct]').forEach((x,i)=>x.value=i);break;}
case 'preview-question':{const form=$('#admin-question'),q=await collectQuestion(form);$('#question-preview').innerHTML='<h3 class="space-top">Vista previa</h3>'+A.Q.html(q);if(q.image?.url?.startsWith('blob:'))$('#question-preview img').src=q.image.url;await A.hydrate($('#question-preview'));break;}
case 'export-students':{const rows=[['Alumno','Materia','Lecturas','Controles','Trabajo práctico','Evaluación (%)','Estado']];A.S.admin.students.filter(x=>x.profile.role==='student').forEach(({profile,record})=>{const subs=A.S.admin.submissions.filter(x=>x.user_id===profile.id);A.S.courses.forEach(c=>{const t=A.C.training(record,c,subs);rows.push([profile.full_name,c.title,t.done+'/'+c.lessons.length,t.passed+'/'+c.lessons.length,t.tp?'Aprobado':t.submission?.status||'Pendiente',A.C.best(record,c,'exam'),A.C.completed(record,c,subs)?'Aprobada':'Pendiente']);});});const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';A.exportFile('seguimiento-alumnos.csv','\ufeff'+rows.map(row=>row.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');break;}
case 'export-bank':A.exportFile('preguntas-'+c.id+'.json',c.questions.map(q=>Object.fromEntries(Object.entries(q).filter(([k])=>!k.startsWith('_')))));break;
}}
async function submit(form){const c=cNow(),fd=new FormData(form),d=Object.fromEntries(fd),n=c&&A.clone(c);if(form.dataset.reviewForm){const s=A.S.admin.submissions.find(x=>x.id===form.dataset.reviewForm);if(d.status==='changes'&&!d.feedback.trim())throw Error('Escribí una devolución para solicitar cambios.');await A.repo.review(s,{status:d.status,grade:d.grade===''?null:Number(d.grade),feedback:d.feedback.trim()});A.S.admin=null;await A.render();A.notify('Corrección guardada.');return;}
switch(form.getAttribute('id')){
case 'admin-create-user':{if(!fd.has('authorized'))throw Error('Confirmá la autorización del acceso.');A.S.invitation=null;A.S.invitation=await A.repo.createAccount(d.name.trim(),d.email.trim().toLowerCase(),d.role);A.S.admin=await A.repo.all();A.go('admin/usuarios');await A.render();break;}
case 'admin-course':Object.assign(n,{title:d.title.trim(),short:d.short.trim(),description:d.description.trim(),pass:Number(d.pass),lessonPass:Number(d.lessonPass),examCount:Number(d.examCount),examMinutes:Number(d.examMinutes)});if(!n.title||!n.short)throw Error('Completá el nombre.');await A.saveCourse(n);await A.render();A.notify('Materia actualizada.');break;
case 'admin-source':{const file=form.querySelector('[name=file]').files[0];if(!file&&!A.C.safeUrl(d.url))throw Error('Agregá un enlace válido o un archivo.');const source={id:A.uid(),title:d.title.trim(),description:d.description.trim()};if(file)source.asset=await A.repo.upload(A.S.user,file,'materials',c.id);else source.url=A.C.safeUrl(d.url);n.sources.push(source);await A.saveCourse(n);await A.render();A.notify('Fuente agregada.');break;}
case 'admin-work':n.tp={...n.tp,instructions:d.instructions.trim(),required:fd.has('required')};if(fd.has('removeAsset'))delete n.tp.asset;{const file=form.querySelector('[name=file]').files[0];if(file)n.tp.asset=await A.repo.upload(A.S.user,file,'materials',c.id);}await A.saveCourse(n);A.notify('Trabajo práctico actualizado.');await A.render();break;
case 'admin-question':{const q=await collectQuestion(form,true),i=n.questions.findIndex(x=>x.id===q.id);if(i>=0)n.questions[i]=q;else n.questions.push(q);await A.saveCourse(n);A.go('admin/materia/'+c.id+'/preguntas');A.notify('Pregunta guardada.');break;}
case 'admin-lesson':{const old=c.lessons.find(l=>l.id===d.id),videoFile=form.querySelector('[name=videoFile]').files[0],l={id:d.id||A.uid(),title:d.title.trim(),minutes:Number(d.minutes),body:d.body.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean),takeaway:d.takeaway.trim(),video:old?.video||null,checkpoints:[]};if(fd.has('removeVideo'))l.video=null;if(d.videoUrl.trim()){const url=A.C.safeUrl(d.videoUrl.trim());if(!url||!(/\.(mp4|webm)$/i.test(new URL(url).pathname)))throw Error('Usá un enlace directo a MP4 o WEBM, o subí el video.');l.video={url};}if(videoFile){if(!/^video\/(mp4|webm)$/.test(videoFile.type))throw Error('El video debe ser MP4 o WEBM.');l.video=await A.repo.upload(A.S.user,videoFile,'materials',c.id);}form.querySelectorAll('.checkpoint-editor').forEach(el=>l.checkpoints.push({id:el.dataset.checkpoint,time:Number(el.querySelector('[name=checkpointTime]').value),questionId:el.querySelector('[name=checkpointQuestion]').value}));if(l.checkpoints.length&&!l.video)throw Error('Para insertar preguntas, cargá primero un video.');if(l.checkpoints.some(cp=>!Number.isFinite(cp.time)||cp.time<0||!c.questions.some(q=>q.id===cp.questionId)))throw Error('Revisá los tiempos y preguntas del video.');if(new Set(l.checkpoints.map(cp=>cp.time)).size!==l.checkpoints.length)throw Error('Los controles de video deben tener tiempos distintos.');const i=n.lessons.findIndex(x=>x.id===l.id);if(i>=0)n.lessons[i]=l;else n.lessons.push(l);await A.saveCourse(n);A.go('admin/materia/'+c.id+'/lecciones');A.notify('Lección guardada.');break;}
case 'admin-settings':{const s={order:[...form.querySelectorAll('[data-course-order]')].map(x=>x.dataset.courseOrder),finalCount:Number(d.finalCount),finalMinutes:Number(d.finalMinutes),finalPass:Number(d.finalPass)};await A.saveSettings(s);A.notify('Configuración actualizada.');await A.render();break;}

function mount(root){const disposers=[];function filterBank(){const q=($('#question-search')?.value||'').toLowerCase(),t=$('#question-type-filter')?.value||'';root.querySelectorAll('[data-bank-type]').forEach(el=>el.hidden=!el.dataset.bankPrompt.includes(q)||(t&&el.dataset.bankType!==t));}
const input=ev=>{if(ev.target.id==='access-search'){const q=ev.target.value.toLowerCase();root.querySelectorAll('[data-access-search]').forEach(el=>el.hidden=!el.dataset.accessSearch.includes(q));}if(ev.target.id==='question-search')filterBank();if(ev.target.id==='admin-search'){const q=ev.target.value.toLowerCase();root.querySelectorAll('[data-student-name]').forEach(el=>el.hidden=!el.dataset.studentName.includes(q));}if(['targetX','targetY'].includes(ev.target.name)){const dot=$('#target-image .hotspot-dot');if(dot){dot.style.left=root.querySelector('[name=targetX]').value+'%';dot.style.top=root.querySelector('[name=targetY]').value+'%';}}};
const change=async ev=>{if(ev.target.name==='type')$('#question-type-fields').innerHTML=typeFields(ev.target.value);if(ev.target.id==='question-type-filter')filterBank();if(ev.target.id==='submission-filter')root.querySelectorAll('[data-submission-state]').forEach(el=>el.hidden=!!ev.target.value&&el.dataset.submissionState!==ev.target.value);if(ev.target.name==='imageFile'){const file=ev.target.files[0];if(file&&!/^image\/(png|jpeg|webp)$/.test(file.type)){A.notify('Usá una imagen PNG, JPG o WEBP.',true);return;}if(file){const url=URL.createObjectURL(file);disposers.push(()=>URL.revokeObjectURL(url));$('#target-image').innerHTML=`<img src="${url}" alt="Vista para definir la respuesta"><span class="hotspot-dot" style="left:50%;top:50%"></span>`;}}if(ev.target.name==='imageUrl'&&A.C.safeUrl(ev.target.value))$('#target-image').innerHTML=`<img src="${e(A.C.safeUrl(ev.target.value))}" alt="Vista para definir la respuesta"><span class="hotspot-dot" style="left:50%;top:50%"></span>`;};
const click=ev=>{const img=ev.target.closest('#target-image img');if(img){const box=img.getBoundingClientRect(),x=(ev.clientX-box.left)/box.width*100,y=(ev.clientY-box.top)/box.height*100;root.querySelector('[name=targetX]').value=x.toFixed(1);root.querySelector('[name=targetY]').value=y.toFixed(1);const dot=$('#target-image .hotspot-dot');dot.style.left=x+'%';dot.style.top=y+'%';}};
root.addEventListener('input',input);root.addEventListener('change',change);root.addEventListener('click',click);return()=>{root.removeEventListener('input',input);root.removeEventListener('change',change);root.removeEventListener('click',click);disposers.forEach(f=>f());};}
window.CampusAdmin={init,view,action,submit,mount};})();

const S={user:null,courses:[],record:C.blank(),settings:clone(STORE.defaults),submissions:[],admin:null,quiz:null,result:null,auth:'login',error:'',message:'',cardIndex:0,cardBack:false};let repo,cleanup=()=>{},rev=0,toaster,quizSaving=false;
const route=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),go=path=>{if(location.hash==='#/'+path)render();else location.hash='/'+path;},course=id=>S.courses.find(c=>c.id===id),admin=()=>['admin','owner'].includes(S.user?.role);

const date=v=>v?new Date(v).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'—';

const button=(text,action,data='',secondary=false)=>`<button type="button" class="button ${secondary?'secondary':''}" data-action="${action}" ${data}>${esc(text)}</button>`;

function canExam(c){return admin()||C.examOpen(S.record,c,S.courses,S.submissions);}
function finalOpen(){return admin()||S.courses.every(c=>C.completed(S.record,c,S.submissions));}
function state(c,r=S.record,subs=S.submissions){if(!C.opened(r,c,S.courses,subs))return ['Bloqueada','locked'];if(C.completed(r,c,subs))return ['Aprobada','success'];if(C.training(r,c,subs).ready)return ['Evaluación habilitada','ready'];return ['En formación',''];}

async function saveCourse(c){await repo.catalog(c);S.courses=S.courses.map(x=>x.id===c.id?clone(c):x);S.admin=null;}
async function saveSettings(s){await repo.settings(s);S.settings=s;S.courses.sort((a,b)=>s.order.indexOf(a.id)-s.order.indexOf(b.id));}
async function enter(user){S.user=user;if(user.access_status!=='active'){S.record=C.blank();S.courses=[];S.admin=null;S.quiz=null;S.result=null;S.accessMessage='';await render();return;}const r=await repo.load(user);if(BASE.some(c=>!r.content[c.id])&&repo.live)throw Error('Falta cargar los contenidos. Ejecutá completo SUPABASE-ACCESOS.sql.');S.user=user;S.operational=null;S.record=STORE.cleanRecord(r.record);S.settings={...clone(STORE.defaults),...r.settings};S.courses=BASE.map(b=>STORE.normalize(r.content[b.id],b)).sort((a,b)=>S.settings.order.indexOf(a.id)-S.settings.order.indexOf(b.id));S.submissions=r.submissions;S.quiz=null;S.result=null;S.admin=null;S.error='';await render();if(repo.live)repo.notify().catch(()=>{});}
