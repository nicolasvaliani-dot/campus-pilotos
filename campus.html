function uiIcon(name){const paths={book:'M3 4h6a4 4 0 0 1 3 2 4 4 0 0 1 3-2h6v16h-6a4 4 0 0 0-3 2 4 4 0 0 0-3-2H3ZM12 6v16',file:'M6 3h9l4 4v14H6ZM14 3v5h5M9 12h7M9 16h7',question:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM9.5 9a2.5 2.5 0 1 1 4 2c-1 .6-1.5 1-1.5 2M12 16h.01',tools:'M14 6a5 5 0 0 0-6 6L3 17a2.1 2.1 0 0 0 3 3l5-5a5 5 0 0 0 6-6l-3 3-3-3 3-3ZM16 17l4 4M6 4l3 3M4 3l2-1 3 4-2 2Z',lock:'M6 10h12v11H6ZM8 10V7a4 4 0 0 1 8 0v3',arrow:'M4 12h16M14 6l6 6-6 6',check:'M5 12l4 4L20 5',plane:'M12 2l2 7 7 4v3l-7-2v5l3 2H7l3-2v-5l-7 2v-3l7-4Z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 7 0 0 1 16 0'};return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;}
function runwayBanner(){const animate=localStorage.getItem('geosim_motion')!=='off';return `<section class="runway-banner ${animate?'':'motion-off'}" aria-label="Campus de Piloto Privado de Avión"><div class="runway-photo"></div><div class="runway-light-layer" aria-hidden="true"></div><div class="runway-shade"></div><div class="campus-banner-copy"><p class="campus-banner-label">CAMPUS · PILOTO PRIVADO DE AVIÓN</p><h2>Tu próximo vuelo empieza acá.</h2><p>Estudiá, practicá y avanzá a tu ritmo.</p></div><button class="runway-motion" data-action="toggle-motion" aria-pressed="${animate}" aria-label="${animate?'Pausar movimiento del fondo':'Activar movimiento del fondo'}">${animate?'Ⅱ':'▷'}</button></section>`;}
function shell(inner){const p=route()[0]||'inicio',active=['inicio','materia','leccion','tarjetas','formacion'].includes(p)?'formacion':['evaluar','final','evaluaciones'].includes(p)?'evaluaciones':p;const landing=p==='inicio'||p==='formacion';return `<header class="geo-header"><div class="geo-header-inner"><a href="#/formacion" class="geo-brand" aria-label="GEO Sim · Formación">${geoLogo()}</a><button class="mobile-toggle" data-action="menu" aria-expanded="false" aria-controls="navigation">Menú ☰</button><nav id="navigation" class="top-navigation" aria-label="Principal">${[['formacion','Formación'],['evaluaciones','Evaluaciones'],['simuladores','Simuladores']].map(([path,title])=>`<a href="#/${path}" ${active===path?'class="active" aria-current="page"':''}>${title}</a>`).join('')}<details class="account-menu"><summary>${uiIcon('user')}<span>Mi cuenta</span><span class="account-chevron">⌄</span></summary><div class="account-dropdown"><span class="account-name">${esc(S.user.full_name)}</span><a href="#/perfil">Mi perfil</a><a href="#/actividad">Mi actividad</a><a href="#/final">Examen final</a>${admin()?'<a href="#/admin">Administración</a>':''}<button data-action="logout">Cerrar sesión</button></div></details></nav></div></header>${landing?runwayBanner():''}<main id="main" class="main ${landing?'formation-main':''}">${inner}</main>`;}
function locked(c,exam=false){const index=S.courses.indexOf(c),previous=S.courses[index-1];return `${heading(exam?'Evaluación no habilitada':c.title)}<section class="card empty"><div class="lock-icon">⌑</div><h2>${exam?'Completá la formación de esta materia':'Materia pendiente de habilitación'}</h2><p>${exam?'Se requieren las lecciones, sus controles y el trabajo práctico aprobado.':previous?'Primero debés aprobar '+esc(previous.short)+'.':''}</p>${link('Volver a formación','formacion',true)}</section>`;}
function nextCourse(){const last=S.record.last&&course(S.record.last.course);return last&&isOpen(last)&&!C.completed(S.record,last,S.submissions)?last:S.courses.find(c=>isOpen(c)&&!C.completed(S.record,c,S.submissions))||S.courses[S.courses.length-1];}
function nextAction(c){const t=C.training(S.record,c,S.submissions);const l=c.lessons.find(l=>!S.record.lessons.includes(l.id));if(l)return {label:'Continuar estudio guiado',path:'leccion/'+c.id+'/'+l.id,title:l.title,icon:'book'};const test=c.lessons.find(l=>C.best(S.record,c,'lesson',l.id)<c.lessonPass);if(test)return {label:'Completar control de lección',path:'evaluar/'+c.id+'/lesson/'+test.id,title:test.title,icon:'question'};if(!t.tp)return {label:t.submission?.status==='pending'?'Trabajo práctico en revisión':t.submission?.status==='changes'?'Revisar trabajo práctico':'Completar trabajo práctico',path:'materia/'+c.id+'/trabajo',title:t.submission?.status==='pending'?'Consultar entrega':'Ver consigna',icon:'file'};return {label:C.completed(S.record,c,S.submissions)?'Materia aprobada':'Rendir evaluación',path:C.completed(S.record,c,S.submissions)?'evaluaciones':'evaluar/'+c.id+'/exam',title:'Ir a evaluación',icon:'question'};}
function courseRows(skipId){const list=S.courses.filter(c=>c.id!==skipId);return `<section class="card compact-curriculum"><div class="curriculum-heading"><h2>${skipId?(list.some(c=>C.completed(S.record,c,S.submissions))?'Otras materias':'Próximas materias'):'Programa de materias'}</h2></div><div class="compact-course-list">${list.map(c=>{const i=S.courses.indexOf(c),open=isOpen(c),passed=C.completed(S.record,c,S.submissions);return `<div class="compact-course-row ${open?'available':'unavailable'}"><span class="compact-number">${String(i+1).padStart(2,'0')}</span>${open?`<a href="#/materia/${c.id}">${esc(c.short)}</a>`:`<span>${esc(c.short)}</span>`}<span class="course-row-status">${passed?`<span class="visually-hidden">Aprobada</span>${uiIcon('check')}`:open?`<a href="#/materia/${c.id}" aria-label="Ingresar a ${esc(c.short)}">${uiIcon('arrow')}</a>`:`<span class="visually-hidden">Bloqueada</span>${uiIcon('lock')}`}</span></div>`;}).join('')}</div></section>`;}
function formation(){const c=nextCourse(),passed=S.courses.filter(c=>C.completed(S.record,c,S.submissions)).length,all=passed===S.courses.length,pct=Math.round(100*passed/Math.max(1,S.courses.length));if(!c)return heading('Mi formación');const progress=C.progress(S.record,c,S.submissions),next=nextAction(c);return `<div class="formation-heading"><h1>Mi formación</h1><div class="program-progress"><span>${passed} de ${S.courses.length} materias aprobadas</span>${bar(pct)}</div></div><div class="formation-feature"><section class="card current-subject"><span class="current-eyebrow">${uiIcon('plane')}${all?'PROGRAMA COMPLETADO':'MATERIA ACTUAL'}</span><h2>${esc(all?'Examen final':c.title)}</h2><p class="subject-subtitle">${esc(all?'Evaluación integradora del programa':({airframe:'Estructuras, sistemas e instrumentos',aero:'Principios del vuelo y maniobras',engine:'Motores, hélices y sistemas',human:'Factores humanos y preparación personal',legal:'Normativa y documentación aeronáutica',radio:'Radiotelefonía y fraseología',meteo:'Atmósfera, viento y partes meteorológicos',nav:'Cartas, rumbos y radioayudas',perf:'Peso, balance y planificación'})[c.id]||c.description)}</p><div class="subject-progress">${bar(all?100:progress.pct)}<span>${all?100:progress.pct}%</span></div><nav class="subject-tabs" aria-label="Actividades de la materia">${[['estudio','Estudio guiado','book'],['fuentes','Fuentes','file'],['actividades','Preguntas','question'],['trabajo','Trabajo práctico','tools']].map(([path,label,icon],i)=>`<a href="#/materia/${c.id}/${path}" class="${i===0?'active':''}">${uiIcon(icon)}<span>${label}</span></a>`).join('')}</nav><div class="current-subject-footer"><a class="button geo-continue" href="#/${all?'final':next.path}">Continuar ${uiIcon('arrow')}</a></div></section><aside class="card next-step"><h2>Próximo paso</h2><div class="next-step-content">${uiIcon(next.icon)}<div><p>${esc(all?'Rendir examen final':next.label)}</p><a href="#/${all?'final':next.path}">${esc(all?'Ver examen':next.icon==='file'?next.title:'Continuar')}</a></div></div></aside></div>${courseRows(c.id)}`;}
function dashboard(){return formation();}
function sourceRows(c){return c.sources.length?`<div class="resource-list">${c.sources.map(s=>`<div><span><strong>${esc(s.title)}</strong>${s.description?`<small>${esc(s.description)}</small>`:''}</span>${s.asset?button('Abrir archivo','open-asset',`data-course="${c.id}" data-source="${s.id}"`,true):`<a class="button secondary small" href="${esc(C.safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">Consultar ↗</a>`}</div>`).join('')}</div>`:'<p class="muted">No hay fuentes cargadas.</p>';}
function lessonRows(c){return c.lessons.map((l,i)=>{const done=S.record.lessons.includes(l.id),b=C.best(S.record,c,'lesson',l.id);return `<div class="lesson-row"><span class="step">${i+1}</span><div><h3><a href="#/leccion/${c.id}/${l.id}">${esc(l.title)}</a></h3><small>${l.minutes} min · ${done?'Lectura completada':'Lectura pendiente'} · ${b>=c.lessonPass?'Control aprobado':'Control pendiente'}</small></div>${link('Estudiar','leccion/'+c.id+'/'+l.id,true)}</div>`;}).join('');}
function courseView(c){if(!isOpen(c))return locked(c);const t=C.training(S.record,c,S.submissions),p=C.progress(S.record,c,S.submissions),tab=route()[2]||'estudio';return `<a class="back-link" href="#/formacion">← Formación</a>${heading(c.title,'',tag(...state(c)))}<div class="tabs" role="navigation" aria-label="Secciones de la materia">${[['estudio','Estudio guiado'],['fuentes','Fuentes'],['actividades','Actividades'],['trabajo','Trabajo práctico']].map(([k,t])=>`<a href="#/materia/${c.id}/${k}" class="${tab===k?'active':''}">${t}</a>`).join('')}</div><div class="course-columns"><section class="card">${tab==='fuentes'?'<h2>Fuentes de estudio</h2>'+sourceRows(c):tab==='actividades'?activities(c):tab==='trabajo'?workView(c):'<h2>Estudio guiado</h2>'+lessonRows(c)}</section><aside class="card course-status"><h2>Estado de formación</h2><dl><div><dt>Lecciones</dt><dd>${t.done}/${c.lessons.length}</dd></div><div><dt>Controles aprobados</dt><dd>${t.passed}/${c.lessons.length}</dd></div><div><dt>Trabajo práctico</dt><dd>${t.tp?'Aprobado':t.submission?.status==='pending'?'En revisión':t.submission?.status==='changes'?'Requiere cambios':'Pendiente'}</dd></div><div><dt>Evaluación</dt><dd>${p.best?p.best+'%':'Pendiente'}</dd></div></dl>${bar(p.pct)}${canExam(c)?link('Ir a evaluación','evaluar/'+c.id+'/exam'):tag('Evaluación bloqueada','locked')}</aside></div>`;}
function activities(c){return `<h2>Actividades de estudio</h2><div class="activity-list"><div><h3>Preguntas de práctica</h3><p>Selección aleatoria con corrección y explicación.</p>${link('Practicar','evaluar/'+c.id+'/practice',true)}</div><div><h3>Verdadero o falso</h3><p>10 preguntas · 2 minutos.</p>${link('Iniciar repaso','evaluar/'+c.id+'/tf',true)}</div><div><h3>Repaso de errores</h3><p>${C.weak(S.record,c).length} preguntas pendientes.</p>${link('Repasar','evaluar/'+c.id+'/review',true)}</div><div><h3>Tarjetas de repaso</h3><p>Conceptos y respuestas con repetición espaciada.</p>${link('Abrir tarjetas','tarjetas/'+c.id,true)}</div>${Object.entries(Q.names).filter(([type])=>c.questions.some(q=>q.type===type)).map(([type,name])=>`<div><h3>${esc(name)}</h3><p>${c.questions.filter(q=>q.type===type).length} preguntas disponibles.</p>${link('Practicar','evaluar/'+c.id+'/practice/-/'+type,true)}</div>`).join('')}</div>`;}
function workView(c){const s=S.submissions.find(x=>x.course_id===c.id);return `<div class="section-heading"><h2>Trabajo práctico</h2>${button('Actualizar estado','refresh-student','',true)}</div><div class="prose">${c.tp.instructions.split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>${c.tp.asset?button('Descargar consigna','open-tp',`data-course="${c.id}"`,true):''}${s?`<div class="submission-state"><div class="row between"><h3>Última entrega</h3>${tag(s.status==='approved'?'Aprobada':s.status==='changes'?'Requiere cambios':'En revisión',s.status==='approved'?'success':'')}</div><p>${esc(s.asset.name)} · ${date(s.submitted_at)}</p>${button('Descargar entrega','open-submission',`data-id="${s.id}"`,true)}${s.feedback?`<h4>Devolución del docente</h4><p>${esc(s.feedback)}</p>`:''}${s.grade!==null?`<p>Calificación: ${s.grade}%</p>`:''}</div>`:''}${s?.status!=='approved'?`<form id="submission-form" class="form-stack"><label>${s?'Reemplazar archivo':'Archivo de entrega'}<input type="file" name="file" accept=".pdf,.docx,.xlsx,.txt,.png,.jpg,.jpeg,.webp" required></label><small>PDF, DOCX, XLSX, TXT o imagen · Hasta 50 MB</small><label>Comentario<textarea name="note" maxlength="4000"></textarea></label><button type="submit" class="button">Enviar trabajo práctico</button><div class="form-status" role="status"></div></form>`:''}`;}
function lessonView(c,l){if(!isOpen(c))return locked(c);const done=S.record.lessons.includes(l.id),i=c.lessons.indexOf(l);return `<a class="back-link" href="#/materia/${c.id}">← ${esc(c.short)}</a>${heading(l.title,`Lección ${i+1} de ${c.lessons.length}`)}<div class="reading-layout"><article class="card reading">${l.video?`<video id="lesson-video" controls preload="metadata" data-video="${esc(JSON.stringify(l.video))}" playsinline></video><section id="video-checkpoint" class="checkpoint" hidden></section>`:''}<div class="prose">${l.body.map(p=>`<p>${esc(p)}</p>`).join('')}</div><blockquote>${esc(l.takeaway)}</blockquote><div class="row wrap">${button(done?'Lectura completada':'Completar lectura','complete-lesson',`data-course="${c.id}" data-id="${l.id}"`,done)}${link('Control de la lección','evaluar/'+c.id+'/lesson/'+l.id,true)}</div><div class="lesson-navigation">${i?`<a href="#/leccion/${c.id}/${c.lessons[i-1].id}">← Lección anterior</a>`:'<span></span>'}${i<c.lessons.length-1?`<a href="#/leccion/${c.id}/${c.lessons[i+1].id}">Siguiente lección →</a>`:''}</div></article><aside class="card"><h2>Fuentes de estudio</h2>${sourceRows(c)}<h2 class="space-top">Lecciones</h2>${c.lessons.map(x=>`<a class="side-lesson ${x.id===l.id?'active':''}" href="#/leccion/${c.id}/${x.id}">${esc(x.title)}</a>`).join('')}</aside></div>`;}
function evaluations(){return `${heading('Evaluaciones por materia','Aprobá la formación de cada materia para habilitar su evaluación.',link('Examen final','final',true))}<div class="evaluation-list">${S.courses.map((c,i)=>{const opened=canExam(c),t=C.training(S.record,c,S.submissions),b=C.best(S.record,c,'exam');return `<section class="card evaluation-row"><span class="step">${i+1}</span><div><h2>${esc(c.title)}</h2><p>${c.examCount} preguntas como máximo · ${c.examMinutes} minutos · Aprobación ${c.pass}%</p><small>${b?'Mejor resultado: '+b+'%':t.ready?'Formación completada':'Formación pendiente'}</small></div>${opened?link('Rendir evaluación','evaluar/'+c.id+'/exam'):tag('Bloqueada','locked')}</section>`;}).join('')}</div>`;}
function finalView(){const open=finalOpen(),count=S.courses.filter(c=>C.completed(S.record,c,S.submissions)).length,best=Math.max(0,...S.record.attempts.filter(a=>a.mode==='final').map(a=>a.score));return `${heading('Examen final','Evaluación integradora del programa.')}<section class="card final-summary"><h2>Examen integrador de piloto privado</h2><dl class="exam-facts"><div><dt>Preguntas</dt><dd>${S.settings.finalCount}</dd></div><div><dt>Tiempo</dt><dd>${S.settings.finalMinutes} min</dd></div><div><dt>Aprobación</dt><dd>${S.settings.finalPass}%</dd></div><div><dt>Materias aprobadas</dt><dd>${count}/${S.courses.length}</dd></div></dl>${best?`<p>Mejor resultado: ${best}%</p>`:''}${open?'<div class="row wrap">'+link('Iniciar examen final','evaluar/final/final')+link('Simulacro general','evaluar/final/mock',true)+'</div>':tag('Se habilita al aprobar todas las materias','locked')}</section>`;}
function quizKey(){return 'cp-draft:'+S.user.id+':'+route().join('/');}
function stash(){if(S.quiz)sessionStorage.setItem(quizKey(),JSON.stringify(S.quiz));}
function prepareQuiz(c,mode,lesson,type){let pool=['final','mock'].includes(mode)?S.courses.flatMap(x=>x.questions.filter(q=>q.purpose!=='practice').map(q=>({...q,_course:x.id}))):c.questions.filter(q=>mode==='exam'?q.purpose!=='practice':true);if(mode==='lesson')pool=pool.filter(q=>q.lesson===lesson);if(mode==='tf')pool=pool.filter(q=>q.type==='tf');if(mode==='review')pool=C.weak(S.record,c);if(type)pool=pool.filter(q=>q.type===type);const count=['final','mock'].includes(mode)?S.settings.finalCount:mode==='exam'?c.examCount:mode==='tf'?10:mode==='lesson'?5:5;return {pool,qs:C.shuffle(pool).slice(0,count).map(q=>({...clone(q)}))};}
function quizView(c,mode,lesson,type){if(!['practice','exam','lesson','tf','review','final','mock'].includes(mode))return notFound();if(['final','mock'].includes(mode)?!finalOpen():mode==='exam'?!canExam(c):!isOpen(c))return ['final','mock'].includes(mode)?finalView():locked(c,mode==='exam');if(mode==='lesson'&&!c.lessons.some(l=>l.id===lesson))return notFound();
const key=route().join('/');if(!S.quiz||S.quiz.key!==key){let draft;try{draft=JSON.parse(sessionStorage.getItem(quizKey())||'null');}catch{}const {pool,qs}=prepareQuiz(c,mode,lesson,type);if(!pool.length)return heading('Sin preguntas disponibles')+link('Volver',c?'materia/'+c.id+'/actividades':'final',true);if(mode==='lesson'&&pool.length<3)return heading('Control pendiente de publicación','El docente debe cargar al menos tres preguntas para esta lección.')+link('Volver a la lección','leccion/'+c.id+'/'+lesson,true);const minutes=['final','mock'].includes(mode)?S.settings.finalMinutes:mode==='exam'?c.examMinutes:mode==='tf'?2:0;S.quiz=draft?.key===key?draft:{key,course:c?.id||'final',mode,lesson,questions:qs,index:0,answers:{},checked:false,deadline:minutes?Date.now()+minutes*60000:null,attemptId:uid()};S.result=null;}
const z=S.quiz;if(S.result)return resultView(S.result);const q=z.questions[z.index],formal=['exam','final','mock','tf','lesson'].includes(mode),answer=z.answers[q.id],correct=C.evaluate(q,answer);
return `${heading(mode==='mock'?'Simulacro general':mode==='final'?'Examen final':mode==='lesson'?'Control de lección':mode==='exam'?'Evaluación · '+c.short:mode==='tf'?'Verdadero o falso':mode==='review'?'Repaso de errores':'Preguntas de práctica')}<div class="quiz-container"><div class="quiz-progress"><span>Pregunta ${z.index+1} de ${z.questions.length}</span>${z.deadline?'<span class="timer" id="quiz-clock" aria-live="off"></span>':''}</div>${bar(Math.round(z.index/z.questions.length*100))}<section class="card"><form id="quiz-form">${Q.html(q,answer)}${z.checked?`<div class="feedback ${correct?'correct':'incorrect'}"><strong>${correct?'Respuesta correcta':'Respuesta incorrecta'}</strong><p>${esc(q.explanation)}</p>${!correct?`<p>Respuesta: ${esc(Q.solution(q))}</p>`:''}</div>`:''}<div class="quiz-actions">${link('Salir',c?'materia/'+c.id+'/actividades':'final',true)}<button type="submit" class="button">${z.saveError?'Reintentar guardado':!formal&&!z.checked?'Corregir':z.index===z.questions.length-1?'Finalizar':'Siguiente'}</button></div><div class="form-status" role="status"></div></form></section></div>`;}
async function finishQuiz(){if(quizSaving)return;quizSaving=true;const z=S.quiz;try{const grade=C.grade(z.questions,z.answers),attempt={id:z.attemptId,course:z.course,lesson:z.lesson||null,mode:z.mode,...grade,at:new Date().toISOString()};const n=clone(S.record);if(!n.attempts.some(a=>a.id===attempt.id))n.attempts.push(attempt);await saveRecord(n,'attempt',attempt);sessionStorage.removeItem(quizKey());S.result={attempt,questions:z.questions};z.saveError=false;await render();}catch(e){z.saveError=true;stash();await render();notify('No se pudo guardar el intento: '+e.message,true);}finally{quizSaving=false;}}
function resultView(result){const a=result.attempt,c=course(a.course),threshold=['final','mock'].includes(a.mode)?S.settings.finalPass:a.mode==='lesson'?c.lessonPass:c?.pass||80;return `${heading('Resultado',c?.title||'Examen final')}<div class="quiz-container"><section class="card"><div class="result-summary"><strong>${a.score}%</strong>${tag(a.score>=threshold?'Aprobado':'No aprobado',a.score>=threshold?'success':'')}</div><p>${a.answers.filter(x=>x.correct).length} respuestas correctas de ${a.answers.length}.</p><div class="result-list">${result.questions.map((q,i)=>`<div><span class="result-check ${a.answers[i].correct?'success':''}">${a.answers[i].correct?'✓':'×'}</span><section><h3>${esc(q.prompt)}</h3><p>${esc(q.explanation)}</p>${!a.answers[i].correct?`<p><strong>Respuesta:</strong> ${esc(Q.solution(q))}</p>`:''}</section></div>`).join('')}</div><div class="row">${link('Volver',c?'materia/'+c.id:'final')}${button('Nuevo intento','restart-quiz','',true)}</div></section></div>`;}
function cardsView(c){if(!isOpen(c))return locked(c);const now=Date.now(),due=c.questions.filter(q=>!S.record.cards[q.id]||new Date(S.record.cards[q.id].due).getTime()<=now);if(!due.length)return heading('Tarjetas de repaso','No hay tarjetas pendientes para hoy.')+link('Volver','materia/'+c.id+'/actividades',true);const q=due[S.cardIndex%due.length];return `<a class="back-link" href="#/materia/${c.id}/actividades">← ${esc(c.short)}</a>${heading('Tarjetas de repaso',due.length+' tarjetas disponibles.')}<section class="card flashcard"><span class="label">${esc(Q.names[q.type])}</span><h2>${esc(q.prompt)}</h2>${q.context?`<pre>${esc(q.context)}</pre>`:''}${S.cardBack?`<div class="card-answer"><h3>${esc(Q.solution(q))}</h3><p>${esc(q.explanation)}</p></div><div class="row wrap">${button('Repetir','rate-card',`data-id="${q.id}" data-rating="again"`,true)}${button('Bien','rate-card',`data-id="${q.id}" data-rating="good"`)}${button('Fácil','rate-card',`data-id="${q.id}" data-rating="easy"`,true)}</div>`:button('Ver respuesta','flip-card')}</section>`;}
function history(record=S.record){const list=[...record.attempts].sort((a,b)=>b.at.localeCompare(a.at));return list.length?`<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Materia</th><th>Actividad</th><th>Resultado</th></tr></thead><tbody>${list.map(a=>`<tr><td>${date(a.at)}</td><td>${esc(course(a.course)?.short||'Programa completo')}</td><td>${{lesson:'Control de lección',exam:'Evaluación',final:'Examen final',mock:'Simulacro general',practice:'Práctica',review:'Repaso',tf:'Verdadero / falso',video:'Control en video'}[a.mode]||esc(a.mode)}</td><td>${a.score}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay intentos registrados.</p>';}
function activity(){return `${heading('Mi actividad','Historial de estudio y evaluaciones.',button('Descargar historial','export-record','',true))}<section class="card">${history()}</section>`;}
function simulators(){const type=route()[1],names={vor:'Navegación VOR',aero:'Aerodinámica',cockpit:'Cabina y fallas'};if(names[type])return `${heading(names[type])}<div class="tabs"><a href="#/simuladores/vor" class="${type==='vor'?'active':''}">VOR</a><a href="#/simuladores/aero" class="${type==='aero'?'active':''}">Aerodinámica</a><a href="#/simuladores/cockpit" class="${type==='cockpit'?'active':''}">Cabina y fallas</a></div>${window.CampusSim.html(type)}`;return `${heading('Simuladores')}<div class="sim-entry-grid">${[['vor','Navegación VOR','Mando de vuelo, trayectoria y prácticas guiadas.','Abrir VOR'],['aero','Aerodinámica','Flujo, sustentación y explicación de cada cambio.','Abrir laboratorio'],['cockpit','Cabina y fallas','Seis instrumentos, pitot, estática, succión y magnetos.','Abrir cabina']].map(([id,title,desc,cta])=>`<section class="card simulator-entry"><h2>${title}</h2><p>${desc}</p>${link(cta,'simuladores/'+id)}</section>`).join('')}</div>`;}

function profileView(){return `${heading('Mi cuenta')}<section class="card narrow"><form id="profile-form" class="form-stack"><label>Nombre completo<input name="name" value="${esc(S.user.full_name)}" required maxlength="80"></label>${S.user.email?`<label>Email<input disabled value="${esc(S.user.email)}"></label>`:''}<button class="button" type="submit">Guardar</button></form>${repo.live?button('Cambiar contraseña','password','',true):''}</section>`;}
function notFound(){return heading('Página no encontrada')+link('Ir al inicio','inicio');}
function blockedView(){const suspended=S.user.access_status==='suspended';return `<header class="geo-header auth-geo-header"><div class="geo-header-inner"><a class="geo-brand" href="index.html">${geoLogo()}</a></div></header><main class="login-page"><section class="login-card"><span class="label">Mi cuenta</span><h1>${suspended?'Acceso suspendido':'Acceso pendiente de habilitación'}</h1><p>${suspended?'Tu progreso está conservado. Contactá a GEO Sim para revisar tu acceso.':'GEO Sim debe habilitar tu cuenta para que puedas ingresar al curso.'}</p><div class="row wrap">${button('Consultar acceso','check-access','',true)}${button('Cerrar sesión','logout','',true)}</div></section></main>`;}
function authView(){const mode=S.auth==='forgot'?'forgot':S.auth==='password'?'password':'login';const box=repo.live?`<form id="auth-form" class="form-stack">${mode!=='password'?'<label>Email<input name="email" type="email" autocomplete="email" required></label>':''}${mode!=='forgot'?`<label>${mode==='password'?'Elegí tu contraseña':'Contraseña'}<input name="password" type="password" minlength="${mode==='login'?1:8}" required autocomplete="${mode==='login'?'current-password':'new-password'}"></label>`:''}${mode==='password'?'<label>Repetí la contraseña<input name="repeat" type="password" required minlength="8" autocomplete="new-password"></label>':''}<button class="button" type="submit">${mode==='forgot'?'Enviar enlace':mode==='password'?'Guardar contraseña':'Ingresar'}</button></form><div class="auth-links">${mode==='login'?button('Recuperar contraseña','auth-mode','data-mode="forgot"',true):button('Volver al ingreso','auth-mode','data-mode="login"',true)}</div>`:`<div class="form-stack">${button('Ingresar como alumno','demo','data-role="student"')}${button('Ingresar como administrador','demo','data-role="admin"',true)}${button('Ingresar como propietario','demo','data-role="owner"',true)}</div>`;return `<header class="geo-header auth-geo-header"><div class="geo-header-inner"><a class="geo-brand" href="index.html" aria-label="GEO Sim">${geoLogo()}</a></div></header><main class="login-page"><section class="login-card"><span class="label">Campus privado</span><h1>${mode==='forgot'?'Recuperar contraseña':mode==='password'?'Configurá tu acceso':'Ingresar al campus'}</h1>${mode==='login'?'<p class="muted">Ingresá con la cuenta habilitada por GEO Sim.</p>':''}${S.error?`<p class="status-error" role="alert">${esc(S.error)}</p>`:''}${S.message?`<p class="status-success">${esc(S.message)}</p>`:''}${box}</section></main>`;}
function exportFile(name,value,type='application/json'){const url=URL.createObjectURL(new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function openAsset(asset){const w=window.open('about:blank','_blank');if(w)w.opener=null;try{const url=await repo.url(asset);if(w)w.location.href=url;else{const a=document.createElement('a');a.href=url;a.download=asset.name;a.click();}if(url.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){w?.close();throw e;}}
async function mountVideo(c,l,root){const video=root.querySelector('#lesson-video');if(!video)return()=>{};let solved=new Set(),active=null;const checkpoint=root.querySelector('#video-checkpoint');function examine(){if(active){video.pause();return;}const cp=[...(l.checkpoints||[])].sort((a,b)=>a.time-b.time).find(x=>x.time<=video.currentTime&&!solved.has(x.id)),q=cp&&c.questions.find(q=>q.id===cp.questionId);if(!q)return;active=cp;video.pause();video.currentTime=cp.time;checkpoint.hidden=false;checkpoint.innerHTML=`<h3>Control de comprensión</h3><form id="video-question-form">${Q.html(clone(q))}<button type="submit" class="button">Responder y continuar</button><div class="form-status" role="status"></div></form>`;S.video={q,c,finish:()=>{solved.add(cp.id);active=null;checkpoint.hidden=true;S.video=null;video.play().catch(()=>{});}};}
video.addEventListener('timeupdate',examine);video.addEventListener('play',examine);return()=>{S.video=null;video.pause();video.removeEventListener('timeupdate',examine);video.removeEventListener('play',examine);};}
const A={S,C,Q,esc,clone,uid,course,route,go,notify,heading,link,button,tag,bar,date,history,saveCourse,saveSettings,exportFile,openAsset,hydrate,render:()=>render(),get repo(){return repo;}};
let initializedAdmin=false;
async function render(){cleanup();cleanup=()=>{};const current=++rev;if(!repo)return;if(!S.user||S.auth==='password'){app.innerHTML=authView();return;}if(S.user.access_status!=='active'){app.innerHTML=blockedView();return;}const r=route(),p=r[0]||'inicio';if(p!=='evaluar'){S.quiz=null;S.result=null;}if(p==='admin'&&admin()&&!S.admin){app.innerHTML=shell('<div class="card">Cargando administración…</div>');try{S.admin=await repo.all();if(current!==rev)return;}catch(e){app.innerHTML=shell(heading('No se pudo cargar la administración',e.message)+button('Reintentar','refresh-admin'));return;}}
let html,c=course(r[1]),l;
switch(p){case 'inicio':html=dashboard();break;case 'formacion':html=formation();break;case 'materia':html=c?courseView(c):notFound();break;case 'leccion':l=c?.lessons.find(x=>x.id===r[2]);html=l?lessonView(c,l):notFound();break;case 'evaluaciones':html=evaluations();break;case 'final':html=finalView();break;case 'evaluar':html=c||r[1]==='final'?quizView(c,r[2],r[3],r[4]):notFound();break;case 'tarjetas':html=c?cardsView(c):notFound();break;case 'actividad':html=activity();break;case 'simuladores':html=simulators();break;case 'perfil':html=profileView();break;case 'admin':if(admin()&&repo.live&&['llamadas'].includes(r[1])&&!S.operational){try{S.operational=await repo.operational();}catch(e){html=heading('No se pudo cargar',e.message);break;}}if(!initializedAdmin){window.CampusAdmin.init(A);initializedAdmin=true;}html=admin()?window.CampusAdmin.view():heading('Acceso restringido');break;default:html=notFound();}
app.innerHTML=shell(html);document.title=(c?.short||'Campus')+' · GEO Sim';const main=$('#main'),disposers=[Q.mount(main)];
if(p==='simuladores'&&r[1])disposers.push(window.CampusSim.mount(r[1],main));
if(p==='admin'&&admin())disposers.push(window.CampusAdmin.mount(main));
if(p==='evaluar'&&S.quiz&&!S.result){const z=S.quiz;stash();if(z.checked)main.querySelectorAll('.answer-fields input,.answer-fields select,.answer-fields button').forEach(el=>el.disabled=true);if(z.deadline){let expired=false;const tick=()=>{const seconds=Math.max(0,Math.ceil((z.deadline-Date.now())/1000));const clock=$('#quiz-clock');if(clock)clock.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(!seconds&&!expired&&!z.saveError){expired=true;finishQuiz();}};const timer=setInterval(tick,500);disposers.push(()=>clearInterval(timer));tick();}}
const disposeAssets=await hydrate(main);if(current!==rev){disposers.forEach(f=>f());disposeAssets();return;}disposers.push(disposeAssets);
if(p==='leccion'&&l&&isOpen(c)){disposers.push(await mountVideo(c,l,main));if(S.record.last?.lesson!==l.id){const n=clone(S.record);n.last={course:c.id,lesson:l.id};try{await saveRecord(n,'learning');}catch(e){notify(e.message,true);}}}
cleanup=()=>disposers.forEach(f=>f());
}
async function action(el){const {action:act}=el.dataset;switch(act){
case 'demo':await enter(await repo.demo(el.dataset.role));break;
case 'logout':await repo.logout();S.user=null;S.courses=[];S.record=C.blank();S.submissions=[];S.admin=null;S.invitation=null;S.auth='login';S.quiz=null;S.video=null;S.admin=null;window.history.replaceState(null,'',location.pathname+location.search);render();break;
case 'auth-mode':S.auth=el.dataset.mode==='forgot'?'forgot':'login';S.error='';S.message='';render();break;
case 'password':S.auth='password';render();break;
case 'toggle-motion':{const banner=el.closest('.runway-banner'),off=!banner.classList.contains('motion-off');banner.classList.toggle('motion-off',off);localStorage.setItem('geosim_motion',off?'off':'on');el.setAttribute('aria-pressed',String(!off));el.setAttribute('aria-label',off?'Activar movimiento del fondo':'Pausar movimiento del fondo');el.textContent=off?'▷':'Ⅱ';break;}
case 'menu':{const nav=$('#navigation');nav.classList.toggle('open');el.setAttribute('aria-expanded',nav.classList.contains('open'));break;}
case 'complete-lesson':{const n=clone(S.record),id=el.dataset.id;n.lessons=n.lessons.includes(id)?n.lessons.filter(x=>x!==id):[...n.lessons,id];n.last={course:el.dataset.course,lesson:id};await saveRecord(n,'learning');render();break;}
case 'restart-quiz':sessionStorage.removeItem(quizKey());S.quiz=null;S.result=null;render();break;
case 'flip-card':S.cardBack=true;render();break;
case 'rate-card':{const n=clone(S.record);n.cards[el.dataset.id]=C.cardSchedule(n.cards[el.dataset.id],el.dataset.rating);await saveRecord(n,'learning');S.cardBack=false;S.cardIndex++;render();break;}
case 'export-record':exportFile('historial-campus.json',{name:S.user.full_name,record:S.record,submissions:S.submissions});break;
case 'open-asset':{const c=course(el.dataset.course),source=c.sources.find(x=>x.id===el.dataset.source);await openAsset(source.asset);break;}
case 'open-tp':await openAsset(course(el.dataset.course).tp.asset);break;
case 'open-submission':{const s=[...S.submissions,...(S.admin?.submissions||[])].find(x=>x.id===el.dataset.id);await openAsset(s.asset);break;}
case 'refresh-admin':S.admin=null;await render();break;
case 'check-access':{const current=await repo.access();if(current)await enter(current);else{S.user=null;render();}break;}
case 'refresh-student':await enter(await repo.access());break;
default:if(admin()&&initializedAdmin)await window.CampusAdmin.action(el);
}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;el.disabled=true;try{await action(el);}catch(err){notify(err.message,true);}finally{if(el.isConnected)el.disabled=false;}});
async function submit(form){const d=Object.fromEntries(new FormData(form)),r=route(),c=course(r[1]);switch(form.getAttribute('id')){
case 'demo-new':await enter(await repo.demo('student',d.name.trim()));break;
case 'auth-form':try{S.error='';if(S.auth==='forgot'){await repo.forgot(d.email.trim());S.message='Si el email está registrado, recibirás un enlace.';render();}else if(S.auth==='password'){if(d.password!==d.repeat)throw Error('Las contraseñas no coinciden.');await repo.password(d.password);S.auth='login';if(new URLSearchParams(location.search).has('setup')){const clean=new URL(location.href);clean.searchParams.delete('setup');window.history.replaceState(null,'',clean.pathname+clean.search+clean.hash);}const user=S.user||await repo.session();if(user)await enter(user);else render();}else await enter(await repo.login(d.email.trim(),d.password));}catch(e){S.error=e.message;render();}break;
case 'profile-form':if(!d.name.trim())throw Error('Ingresá un nombre.');S.user=await repo.profile(S.user,d.name.trim());render();notify('Datos actualizados.');break;
case 'quiz-form':{const z=S.quiz;if(z.saveError){await finishQuiz();break;}if(z.deadline&&Date.now()>=z.deadline){await finishQuiz();break;}const q=z.questions[z.index],formal=['exam','final','mock','tf','lesson'].includes(z.mode);if(!z.checked){z.answers[q.id]=Q.read(form,q);if(!formal){z.checked=true;stash();render();break;}}if(z.index<z.questions.length-1){z.index++;z.checked=false;stash();render();}else await finishQuiz();break;}
case 'submission-form':{if(!isOpen(c))throw Error('Materia bloqueada.');if(S.submissions.find(x=>x.course_id===c.id)?.status==='approved')throw Error('El trabajo ya está aprobado.');const file=form.querySelector('[name=file]').files[0];if(file?.type.startsWith('video/'))throw Error('La entrega debe ser un documento o una imagen.');const status=form.querySelector('.form-status');status.textContent='Subiendo archivo…';const asset=await repo.upload(S.user,file,'submissions',c.id);status.textContent='Registrando entrega…';const s=await repo.submit(S.user,c.id,asset,d.note);S.submissions=S.submissions.filter(x=>x.course_id!==c.id).concat(s);S.admin=null;render();notify('Trabajo práctico entregado.');break;}
case 'video-question-form':{const v=S.video;if(!v)throw Error('El control no está disponible.');const answer=Q.read(form,v.q),correct=C.evaluate(v.q,answer);if(!correct){form.querySelector('.form-status').textContent='Respuesta incorrecta. '+v.q.explanation;break;}const n=clone(S.record),a={id:uid(),course:v.c.id,lesson:v.q.lesson,mode:'video',...C.grade([v.q],{[v.q.id]:answer}),at:new Date().toISOString()};n.attempts.push(a);await saveRecord(n,'attempt',a);v.finish();break;}
default:if(admin()&&initializedAdmin)await window.CampusAdmin.submit(form);
}}
document.addEventListener('submit',async e=>{if(!e.target.matches('form'))return;e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]');if(b?.disabled)return;if(b)b.disabled=true;try{await submit(f);}catch(err){const status=f.querySelector('.form-status');if(status)status.textContent=err.message;notify(err.message,true);}finally{if(b?.isConnected)b.disabled=false;}});
window.addEventListener('hashchange',()=>{S.cardIndex=0;S.cardBack=false;render();window.scrollTo(0,0);});
async function boot(){try{repo=await STORE.create(CFG);repo.onAuth?.(e=>{if(e==='PASSWORD_RECOVERY'){S.auth='password';render();}});const user=await repo.session();if(user){if(new URLSearchParams(location.search).get('setup')==='1')S.auth='password';await enter(user);}else render();}catch(e){app.innerHTML=`<main class="login-page"><section class="card"><h1>No se pudo iniciar el campus</h1><p>${esc(e.message)}</p><button class="button" onclick="location.reload()">Reintentar</button></section></main>`;}}
window.CampusApp=A;boot();let checkingAccess=false;setInterval(async()=>{if(!repo?.live||!S.user||checkingAccess)return;checkingAccess=true;try{const current=await repo.access();if(!current){S.user=null;S.courses=[];S.record=C.blank();render();}else if(current.role!==S.user.role||current.access_status!==S.user.access_status)await enter(current);}catch{}finally{checkingAccess=false;}},20000);
})();

</script>
