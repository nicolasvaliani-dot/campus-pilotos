        "takeaway": "Equilibrio de fuerzas significa ausencia de aceleración, no ausencia de movimiento."

        "id": "aero-2",

          "El ángulo de ataque se mide entre la cuerda del ala y el viento relativo. No es lo mismo que la actitud respecto del horizonte. Al aumentar el ángulo, la sustentación suele crecer hasta un máximo; superado el ángulo crítico, la separación del flujo reduce la sustentación y aumenta la resistencia.",

<script>
/* Lógica independiente de la interfaz: seguimiento y modelos didácticos. */
(function(root){
'use strict';
const normalize = n => ((Number(n)%360)+360)%360;
const delta = n => ((n+540)%360)-180;
function vor(x,y,obs){
  const distance=Math.hypot(x,y), radial=normalize(Math.atan2(x,-y)*180/Math.PI), offset=delta(radial-obs);
  const ambiguous=distance<1 || Math.abs(Math.abs(offset)-90)<1;
  const from=Math.abs(offset)<90;
  // La señal del CDI se refiere al curso seleccionado; no al rumbo del avión.
  const error=from ? delta(obs-radial) : delta(radial-obs-180);
  return {radial,distance,flag:ambiguous?'OFF':from?'FROM':'TO',deviation:Math.max(-1,Math.min(1,error/10)),error,ambiguous};
}
function aero(alpha,speed,flap){
  // Modelo cualitativo, sin CFD: ángulo crítico fijo para un perfil genérico.
  const critical=15, a=Number(alpha), f=Number(flap), v=Number(speed), base=0.2+0.025*f;
  const pre=base+0.09*a, cl=a<=critical?pre:Math.max(0.4,base+0.09*critical-0.10*(a-critical));
  const cd=0.025+0.035*cl*cl+0.002*f+(a>critical?0.035*(a-critical):0);
  return {critical,stall:a>critical,cl,cd,liftIndex:Math.max(0,cl)*(v/80)**2,dragIndex:cd*(v/80)**2};
}
function blank(){return {lessons:[],last:null,attempts:[],challenges:{}};}
function unresolved(record,course){
  const latest=new Map();
  [...record.attempts].sort((a,b)=>a.at.localeCompare(b.at)).filter(a=>a.course===course.id).forEach(a=>(a.answers||[]).forEach(x=>latest.set(x.id,x.correct)));
  return course.questions.filter(q=>latest.get(q.id)===false);
}
function progress(record,course){
  const done=course.lessons.filter(l=>record.lessons.includes(l.id)).length;
  const exams=record.attempts.filter(a=>a.course===course.id&&a.mode==='exam');
  const best=exams.length?Math.max(...exams.map(a=>a.score)):0;
  const challenge=!!record.challenges[course.id]?.passed;
  const weak=unresolved(record,course).length;
  const mastered=done===course.lessons.length&&best>=80&&challenge&&weak===0;
  const started=done>0||record.attempts.some(a=>a.course===course.id)||!!record.challenges[course.id];
  const pct=Math.round(40*done/course.lessons.length+40*Math.min(best/80,1)+20*Number(challenge));
  return {done,total:course.lessons.length,best,challenge,weak,mastered,pct:mastered?100:Math.min(pct,99),status:mastered?'Dominada':weak||exams.length&&best<80?'Para repasar':started?'En curso':'Sin empezar'};
}
function grade(questions,answers){
  const details=questions.map(q=>({id:q.id,selected:Number(answers[q.id]),correct:Number(answers[q.id])===q.correct}));
  return {score:Math.round(100*details.filter(x=>x.correct).length/questions.length),answers:details};
}
function shuffle(list,rng=Math.random){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function balance(baggage){const weight=750+Number(baggage),cg=(780+2*Number(baggage))/weight;return {weight,cg,allowed:weight<=800&&cg>=1&&cg<=1.08};}
const api={normalize,delta,vor,aero,blank,unresolved,progress,grade,shuffle,balance};root.CampusCore=api;
if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

</script>

function courseView(c){const p=C.progress(S.record,c);return `<a class="crumb" href="#/materias">${icon('back')}Volver a materias</a>${heading('Materia · piloto privado',esc(c.title),esc(c.description),statusBadge(p))}<div class="course-layout"><div class="stack"><section class="card"><div class="row between"><h2>Tu recorrido</h2><span class="small muted">${p.done} de ${p.total} lecciones</span></div><div class="spaced">${c.lessons.map((l,i)=>`<a class="lesson-row ${S.record.lessons.includes(l.id)?'done':''}" href="#/materia/${c.id}/leccion/${l.id}"><span class="step">${S.record.lessons.includes(l.id)?'✓':String(i+1).padStart(2,'0')}</span><div><strong>${esc(l.title)}</strong><small>${l.minutes} min · Teoría y concepto clave</small></div>${icon('arrow')}</a>`).join('')}</div></section><section class="card"><span class="eyebrow">Aplicá lo aprendido</span><h2 style="margin:12px 0">${esc(c.challenge.title)}</h2><p class="muted small">${esc(c.challenge.description)}</p><a class="btn secondary spaced" href="#/desafio/${c.id}">${p.challenge?'Volver a practicar':'Abrir desafío'}${icon('arrow')}</a></section></div><aside class="stack" style="align-content:start"><section class="card"><h3>Tu avance formativo</h3><div class="result-score" style="font-size:3rem;margin:20px 0">${p.pct}<span style="font-size:1.2rem">%</span></div>${bar(p.pct)}<div class="metric-list spaced"><div><span>Teoría completada</span><strong>${p.done}/${p.total}</strong></div><div><span>Mejor evaluación</span><strong>${p.best?p.best+'%':'Pendiente'}</strong></div><div><span>Desafío</span><strong>${p.challenge?'Aprobado':'Pendiente'}</strong></div><div><span>Preguntas para repasar</span><strong>${p.weak}</strong></div></div><p class="small muted spaced">Dominada: todas las lecciones, evaluación ≥80%, desafío aprobado y ningún error pendiente.</p></section><section class="card"><h3>Comprobá lo que sabés</h3><p class="small muted spaced">Práctica: 5 preguntas con devolución inmediata. Evaluación: ${c.questions.length} preguntas, devolución al finalizar.</p><a class="btn secondary wide spaced" href="#/evaluar/${c.id}/practice">Practicar</a><a class="btn wide" style="margin-top:10px" href="#/evaluar/${c.id}/exam">Rendir evaluación</a>${p.weak?`<a class="text-link spaced" href="#/evaluar/${c.id}/review">Repasar mis errores →</a>`:''}</section></aside></div>`;}
function lessonView(c,l){const i=c.lessons.indexOf(l),done=S.record.lessons.includes(l.id);return `<a class="crumb" href="#/materia/${c.id}">${icon('back')}${esc(c.short)}</a><div class="course-layout"><article class="card reading"><span class="eyebrow">Lección ${i+1} de ${c.lessons.length} · ${l.minutes} min</span><h1 class="spaced">${esc(l.title)}</h1>${l.body.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="takeaway"><span class="eyebrow">Concepto clave</span><p style="margin-top:8px;color:inherit">${esc(l.takeaway)}</p></div><button class="btn ${done?'secondary':''}" data-action="lesson-done" data-course="${c.id}" data-lesson="${l.id}">${icon('check')}${done?'Completada · desmarcar':'Marcar como completada'}</button><div class="lesson-nav">${i?`<a class="text-link" href="#/materia/${c.id}/leccion/${c.lessons[i-1].id}">← Anterior</a>`:'<span></span>'}${i<c.lessons.length-1?`<a class="btn secondary" href="#/materia/${c.id}/leccion/${c.lessons[i+1].id}">Siguiente lección →</a>`:`<a class="btn secondary" href="#/evaluar/${c.id}/practice">Practicar preguntas →</a>`}</div></article><aside class="card" style="align-self:start"><h3>Contenido de la materia</h3><div class="spaced">${c.lessons.map((x,n)=>`<a class="lesson-row ${S.record.lessons.includes(x.id)?'done':''}" href="#/materia/${c.id}/leccion/${x.id}" ${x.id===l.id?'aria-current="page"':''}><span class="step">${S.record.lessons.includes(x.id)?'✓':n+1}</span><div><strong style="color:${x.id===l.id?'var(--accent)':'inherit'}">${esc(x.title)}</strong></div></a>`).join('')}</div></aside></div>`;}
function examsView(){return `${heading('Entrená con intención','Preguntas que enseñan.','Practicá con devolución inmediata, rendí una evaluación o recuperá conceptos que te costaron.')}<div class="note">Las evaluaciones de esta edición son formativas y se corrigen en el navegador. El banco inicial tiene 8 preguntas por materia; se mezcla el orden en cada intento. No es un examen oficial ni un sistema de certificación.</div><div class="grid cols-3 spaced">${S.courses.map(c=>{const p=C.progress(S.record,c);return `<section class="card"><div class="row between"><span style="color:var(--accent)">${icon(c.icon)}</span>${p.best?`<span class="badge ${p.best>=80?'green':'amber'}">Mejor: ${p.best}%</span>`:''}</div><h3 class="spaced">${esc(c.short)}</h3><p class="small muted" style="margin-top:10px">${c.questions.length} preguntas · Aprobación formativa: 80%</p><div class="stack spaced"><a class="btn secondary" href="#/evaluar/${c.id}/practice">Práctica guiada · 5 preguntas</a><a class="btn" href="#/evaluar/${c.id}/exam">Rendir evaluación</a>${p.weak?`<a class="text-link" href="#/evaluar/${c.id}/review">Repasar ${p.weak} errores →</a>`:''}</div></section>`;}).join('')}</div>`;}
function quizView(c,mode){
 if(!['practice','review','exam'].includes(mode))return notFound();
 if(!S.quiz||S.quiz.course!==c.id||S.quiz.mode!==mode){const pool=mode==='review'?C.unresolved(S.record,c):c.questions;if(!pool.length)return `${heading('Repaso',esc(c.short),'No tenés preguntas pendientes de repaso en esta materia.')}<a class="btn" href="#/materia/${c.id}">Volver a la materia</a>`;S.quiz={course:c.id,mode,questions:C.shuffle(pool).slice(0,mode==='exam'?pool.length:5).map(q=>({...q,display:C.shuffle(q.options.map((text,value)=>({text,value})))})),index:0,answers:{},checked:false};S.result=null;}
 const qz=S.quiz;if(S.result)return resultView(c,S.result);
 const q=qz.questions[qz.index],selected=qz.answers[q.id],isExam=mode==='exam',correct=selected===q.correct;
 return `<a class="crumb" href="#/materia/${c.id}" data-leave-quiz>${icon('back')}${esc(c.short)}</a><div class="quiz-area">${heading(isExam?'Evaluación sin pistas':mode==='review'?'Recuperación de conceptos':'Práctica guiada',esc(c.short),'Tomate el tiempo para razonar. El intento se guarda cuando lo terminás.')}<div class="question-top"><div class="row between small muted" style="margin-bottom:12px"><span>Pregunta ${qz.index+1} de ${qz.questions.length}</span><span>${isExam?'Resultado al finalizar':'Explicación después de responder'}</span></div>${bar(Math.round(qz.index/qz.questions.length*100))}</div><section class="card"><form id="quiz-form"><fieldset ${qz.checked?'disabled':''}><legend>${esc(q.prompt)}</legend>${q.display.map(o=>`<label class="option"><input type="radio" name="answer" value="${o.value}" required ${selected===o.value?'checked':''}><span>${esc(o.text)}</span></label>`).join('')}</fieldset>${qz.checked?`<div class="feedback ${correct?'':'wrong'}"><strong>${correct?'Respuesta correcta.':'Revisemos este concepto.'}</strong><br>${esc(q.explanation)}${!correct?`<p style="margin-top:8px">Respuesta: ${esc(q.options[q.correct])}</p>`:''}</div>`:''}<div class="row between spaced"><span class="small muted">${isExam?'Sin límite de tiempo':'Aprender también es corregir.'}</span><button class="btn" type="submit">${isExam||qz.checked?qz.index===qz.questions.length-1?'Finalizar y guardar':'Siguiente pregunta':'Comprobar respuesta'}${icon('arrow')}</button></div><div class="form-status spaced" id="quiz-status" role="status"></div></form></section></div>`;
}
function resultView(c,result){const a=result.attempt,passed=a.score>=80;return `<a class="crumb" href="#/materia/${c.id}">${icon('back')}Volver a ${esc(c.short)}</a><div class="quiz-area">${heading('Debriefing',passed?'Buen trabajo.<br>Seguí construyendo.':'Ya sabés qué repasar.','Cada intento deja información útil para tu próxima sesión.')}<section class="card"><div class="row between"><div><div class="result-score">${a.score}<span style="font-size:1.6rem">%</span></div><p class="muted small">${a.answers.filter(x=>x.correct).length} de ${a.answers.length} respuestas correctas</p></div><span class="badge ${passed?'green':'amber'}">${a.mode==='exam'?passed?'Evaluación aprobada':'Para repasar':'Práctica completada'}</span></div><div class="note spaced">${a.mode==='exam'?'Este resultado cuenta para el avance de la materia.':'La práctica identifica conceptos para reforzar. Para completar la materia, rendí también su evaluación.'} El intento quedó guardado.</div>${result.questions.map((q,i)=>{const x=a.answers[i];return `<div class="review-item"><span class="badge ${x.correct?'green':'amber'}">${x.correct?'Correcta':'Para reforzar'}</span><strong class="spaced">${esc(q.prompt)}</strong><p>Tu respuesta: ${esc(q.options[x.selected])}</p>${!x.correct?`<p class="correct-answer">Respuesta correcta: ${esc(q.options[q.correct])}</p>`:''}<p>${esc(q.explanation)}</p><a class="text-link" style="margin-top:10px" href="#/materia/${c.id}/leccion/${q.lesson}">Revisar la lección →</a></div>`;}).join('')}<div class="lesson-nav"><a class="btn secondary" href="#/materia/${c.id}">Ver mi recorrido</a><button class="btn" data-action="quiz-restart" data-course="${c.id}" data-mode="${C.unresolved(S.record,c).length?'review':'exam'}">${C.unresolved(S.record,c).length?'Repasar errores':'Nuevo intento'}${icon('arrow')}</button></div></section></div>`;}
function challengeView(c){const ch=c.challenge,p=S.record.challenges[c.id];const top=`<a class="crumb" href="#/materia/${c.id}">${icon('back')}${esc(c.short)}</a>${heading('Práctica aplicada',esc(ch.title),esc(ch.description),p?.passed?'<span class="badge green">Desafío aprobado</span>':'<span class="badge cyan">Desafío de la materia</span>')}`;
 if(ch.type==='vor'||ch.type==='aero')return top+window.CampusSim.html(ch.type);
 if(ch.type==='performance')return top+`<div class="grid cols-2"><section class="card"><h2>El cálculo, a la vista</h2><div class="note spaced">Datos ficticios para practicar. Peso máximo: 800 kg. Centro de gravedad permitido: 1,00 a 1,08 m. Sin combustible ni otras cargas en este problema simplificado.</div><label class="control"><div><span>Equipaje · brazo 2,00 m</span><output id="baggage-out">20 kg</output></div><input type="range" min="0" max="70" value="20" id="baggage" aria-label="Equipaje en kilogramos"></label><div class="metric-list spaced"><div><span>Peso total</span><strong id="balance-weight"></strong></div><div><span>Momento total</span><strong id="balance-moment"></strong></div><div><span>Centro de gravedad</span><strong id="balance-cg"></strong></div></div><div class="note spaced" id="balance-status"></div><p class="small muted spaced">Peso = 600 + 150 + equipaje.<br>Momento = 600 × 1,00 + 150 × 1,20 + equipaje × 2,00.<br>CG = momento / peso.</p></section><section class="card"><h2>Encontrá una carga admisible</h2><p class="small muted spaced">Ajustá el equipaje para respetar simultáneamente el peso máximo y el intervalo de CG. Después identificá la comprobación correcta.</p><form id="performance-form" class="form-grid spaced"><label>¿Qué límites deben verificarse?<select name="criterion" required><option value="">Elegí una opción</option><option value="weight">Solo el peso</option><option value="both">Peso y centro de gravedad</option><option value="cg">Solo el centro de gravedad</option></select></label><button class="btn" type="submit">Comprobar planificación</button></form><div class="form-status spaced" id="challenge-feedback" role="status"></div></section></div>`;
 return top+`<div class="quiz-area"><section class="card"><span class="eyebrow">Caso de estudio</span><p class="spaced">${esc(ch.description)}</p><form id="challenge-form" class="form-grid spaced">${ch.fields.map((f,i)=>`<label>${esc(f.label)}<select name="field-${i}" required><option value="">Elegí una respuesta</option>${f.options.map((o,n)=>`<option value="${n}">${esc(o)}</option>`).join('')}</select></label>`).join('')}<button class="btn" type="submit">Comprobar y guardar</button></form><div class="form-status spaced" id="challenge-feedback" role="status"></div><div id="challenge-explanation"></div></section></div>`;
}
function attemptTable(attempts){return `<div class="table-wrap"><table><thead><tr><th>Materia</th><th>Actividad</th><th>Resultado</th><th>Fecha</th></tr></thead><tbody>${attempts.map(a=>`<tr><td>${esc(courseBy(a.course)?.short||a.course)}</td><td>${a.mode==='exam'?'Evaluación':a.mode==='review'?'Repaso':'Práctica'}</td><td><span class="badge ${a.score>=80?'green':'amber'}">${a.score}%</span></td><td class="muted">${date(a.at)}</td></tr>`).join('')}</tbody></table></div>`;}
function progressView(){const o=overview(),ats=[...S.record.attempts].reverse(),last=ats.slice(0,8).reverse();return `${heading('Seguimiento personal','Tu avance, con sentido.','Lo que completaste, lo que comprendiste y lo que conviene volver a practicar.',`<button class="btn secondary" data-action="export-progress">${icon('download')}Exportar mi progreso</button>`)}<div class="stats"><div class="stat"><span class="stat-label">Avance formativo</span><strong>${o.pct}%</strong>${bar(o.pct)}</div><div class="stat"><span class="stat-label">Lecciones completadas</span><strong>${o.lessons}<span> / 27</span></strong><span>El avance requiere tu confirmación.</span></div><div class="stat"><span class="stat-label">Intentos registrados</span><strong>${o.attempts}</strong><span>${o.weak} preguntas para reforzar</span></div></div><div class="grid cols-2"><section class="card"><h2>Tu evolución reciente</h2><p class="small muted" style="margin-top:10px">Últimos ocho intentos, de más antiguo a más reciente. Compará resultados de una misma materia y tipo de actividad.</p>${last.length?`<div class="history-bars" role="img" aria-label="Resultados recientes: ${last.map(a=>`${courseBy(a.course)?.short} ${a.score}%`).join(', ')}">${last.map(a=>`<div class="history-bar" title="${esc(courseBy(a.course)?.short)} · ${a.score}%"><span>${a.score}%</span><i style="height:${Math.max(2,a.score*.75)}px"></i><span>${new Date(a.at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})}</span></div>`).join('')}</div>`:'<div class="empty">Tus resultados aparecerán después del primer intento completo.</div>'}</section><section class="card"><h2>Cómo se calcula el avance</h2><div class="mini-row"><span class="number">40%</span><div><strong class="small">Lecciones completadas</strong><p>Confirmás que terminaste cada lectura.</p></div></div><div class="mini-row"><span class="number">40%</span><div><strong class="small">Evaluación de la materia</strong><p>El mejor resultado contribuye hasta alcanzar 80%.</p></div></div><div class="mini-row"><span class="number">20%</span><div><strong class="small">Desafío aprobado</strong><p>Para llegar al 100% también deben resolverse los errores pendientes.</p></div></div></section></div><div class="section-title"><h2>Estado por materia</h2></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Materia</th><th>Estado</th><th>Teoría</th><th>Mejor evaluación</th><th>Práctica</th><th>Repaso</th></tr></thead><tbody>${S.courses.map(c=>{const p=C.progress(S.record,c);return `<tr><td><a class="text-link" href="#/materia/${c.id}">${esc(c.short)}</a>${bar(p.pct)}</td><td>${statusBadge(p)}</td><td>${p.done}/${p.total}</td><td>${p.best?p.best+'%':'—'}</td><td>${p.challenge?'✓ Aprobada':'Pendiente'}</td><td>${p.weak?`<a class="text-link" href="#/evaluar/${c.id}/review">${p.weak} preguntas →</a>`:'Sin errores pendientes'}</td></tr>`;}).join('')}</tbody></table></div></section><div class="section-title"><h2>Conceptos para recuperar</h2></div><div class="grid cols-2">${S.courses.flatMap(c=>C.unresolved(S.record,c).map(q=>`<article class="focus-row"><span class="eyebrow">${esc(c.short)}</span><p>${esc(q.prompt)}</p><a class="text-link" href="#/materia/${c.id}/leccion/${q.lesson}">Volver a la teoría →</a> <a class="text-link" style="margin-left:12px" href="#/evaluar/${c.id}/review">Practicar →</a></article>`)).join('')||'<p class="muted small">No hay errores pendientes registrados. Las preguntas sin intentar todavía no se consideran dominadas.</p>'}</div><div class="section-title"><h2>Historial de intentos</h2></div><section class="card">${ats.length?attemptTable(ats):'<div class="empty">Todavía no completaste ninguna práctica o evaluación.</div>'}</section>`;}

 if(S.recovery||S.auth==='password')return authShell(`<span class="eyebrow">Seguridad de la cuenta</span><h2>Elegí una contraseña.</h2><p>Usá al menos 8 caracteres.</p>${authMessages()}<form id="auth-password" class="form-grid"><label>Nueva contraseña<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Repetir contraseña<input type="password" name="repeat" required minlength="8" autocomplete="new-password"></label><button class="btn" type="submit">Guardar contraseña</button></form>`);
 if(!repo.live)return authShell(`<span class="eyebrow">Entrá a explorar</span><h2>Tu próximo paso<br>empieza acá.</h2><p>Teoría, práctica y seguimiento en un mismo lugar.</p>${authMessages()}<div class="stack"><button class="btn wide" data-action="demo" data-role="student">Entrar como alumno ${icon('arrow')}</button><button class="btn secondary wide" data-action="demo" data-role="admin">Explorar como administrador</button></div><div class="divider"></div><form id="demo-profile" class="form-grid"><label>O creá un perfil local de prueba<input name="name" placeholder="Nombre de prueba" required maxlength="80" autocomplete="off"></label><button class="btn ghost" type="submit">Crear perfil demo</button></form><div class="note warning">Demo local: no hay cuentas reales. Los datos se guardan únicamente en este navegador. Para alumnos en distintos equipos, conectá Supabase siguiendo el archivo LEEME.</div>`);
 const register=S.auth==='register',forgot=S.auth==='forgot';return authShell(`<span class="eyebrow">Tu campus de vuelo</span><h2>${forgot?'Recuperá tu acceso.':register?'Empezá tu recorrido.':'Bienvenido de nuevo.'}</h2><p>${forgot?'Te enviaremos un enlace de recuperación.':'Ingresá a tu cuenta para continuar aprendiendo.'}</p>${authMessages()}<form id="auth-form" class="form-grid">${register?'<label>Nombre completo<input name="name" required maxlength="80" autocomplete="name"></label>':''}<label>Email<input name="email" type="email" required autocomplete="email"></label>${!forgot?`<label>Contraseña<input name="password" type="password" required minlength="8" autocomplete="${register?'new-password':'current-password'}"></label>`:''}<button class="btn wide" type="submit">${forgot?'Enviar enlace':register?'Crear cuenta':'Ingresar'}${icon('arrow')}</button></form><div class="row between spaced"><button class="text-link" style="background:none;padding:0" data-action="auth-mode" data-mode="${register||forgot?'login':'register'}">${register||forgot?'Volver a ingresar':'Crear cuenta'}</button>${!forgot?'<button class="text-link" style="background:none;padding:0" data-action="auth-mode" data-mode="forgot">Olvidé mi contraseña</button>':''}</div>`);
}
function authMessages(){return `${S.error?`<p class="auth-error" role="alert">${esc(S.error)}</p>`:''}${S.message?`<p class="auth-success" role="status">${esc(S.message)}</p>`:''}`;}
function authShell(box){return `<main class="auth"><section class="auth-story">${brand()}<div><span class="eyebrow">Escuela de conocimientos · piloto privado</span><h1>Entendé el vuelo.<br><span>Construí tu criterio.</span></h1><p>Un recorrido claro para aprender la teoría, ponerla en práctica y ver cómo avanzás.</p></div><div class="auth-orbit">${orbit()}</div><small class="muted">09 materias &nbsp; / &nbsp; 02 simuladores &nbsp; / &nbsp; Tu propio ritmo</small></section><section class="auth-panel"><div class="auth-box">${box}</div></section></main>`;}
function validateCourse(value,expected){
 const c=clone(value),base=BASE.find(x=>x.id===expected);
 const str=(s,max)=>typeof s==='string'&&s.trim().length>0&&s.length<=max;
 if(!base||c.id!==expected||!str(c.title,160)||!str(c.short,60)||!str(c.description,700))throw new Error('Identificador, título o descripción inválidos.');
 if(!Array.isArray(c.lessons)||c.lessons.length!==base.lessons.length||!c.lessons.every((l,i)=>l.id===base.lessons[i].id&&str(l.title,160)&&Number.isFinite(l.minutes)&&l.minutes>0&&l.minutes<=240&&Array.isArray(l.body)&&l.body.length>0&&l.body.length<=15&&l.body.every(p=>str(p,6000))&&str(l.takeaway,1000)))throw new Error('Las lecciones deben conservar sus identificadores y tener título, duración, párrafos y concepto clave válidos.');
 if(!Array.isArray(c.questions)||c.questions.length!==base.questions.length||!c.questions.every((q,i)=>q.id===base.questions[i].id&&c.lessons.some(l=>l.id===q.lesson)&&str(q.prompt,1000)&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=6&&q.options.every(o=>str(o,1000))&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.options.length&&str(q.explanation,3000)))throw new Error('Las preguntas deben conservar sus identificadores, opciones, índice correcto, explicación y referencia de lección.');
 // Los desafíos y sus modelos se editan en content.js y simulators.js, no desde este editor.
 c.challenge=clone(base.challenge);c.icon=base.icon;return c;
}
function adminView(){
 if(S.user.role!=='admin')return `${heading('Acceso restringido','Panel de administración','Esta sección requiere un perfil de administrador.')}<a class="btn" href="#/inicio">Volver</a>`;
 if(!S.admin)return '<div class="card">Cargando seguimiento de alumnos…</div>';
 const selected=getRoute()[1];if(selected==='contenido')return contentEditor();
 if(selected==='alumno'){const entry=S.admin.find(x=>x.profile.id===getRoute()[2]);if(!entry)return notFound();const {profile,record}=entry;return `<a class="crumb" href="#/admin">${icon('back')}Volver al panel</a>${heading('Seguimiento individual',esc(profile.full_name),`Última actividad: ${record.attempts.length?date([...record.attempts].sort((a,b)=>b.at.localeCompare(a.at))[0].at):'Sin intentos completados'}`)}<section class="card"><div class="table-wrap"><table><thead><tr><th>Materia</th><th>Estado</th><th>Teoría</th><th>Evaluación</th><th>Desafío</th><th>Errores pendientes</th></tr></thead><tbody>${S.courses.map(c=>{const p=C.progress(record,c);return `<tr><td>${esc(c.short)}</td><td>${statusBadge(p)}</td><td>${p.done}/${p.total}</td><td>${p.best?p.best+'%':'—'}</td><td>${p.challenge?'Aprobado':'Pendiente'}</td><td>${p.weak}</td></tr>`;}).join('')}</tbody></table></div></section><div class="section-title"><h2>Preguntas que conviene trabajar</h2></div><div class="grid cols-2">${S.courses.flatMap(c=>C.unresolved(record,c).map(q=>`<div class="focus-row"><span class="eyebrow">${esc(c.short)}</span><p>${esc(q.prompt)}</p><small class="muted">Lección: ${esc(c.lessons.find(l=>l.id===q.lesson)?.title)}</small></div>`)).join('')||'<p class="muted">No hay errores pendientes registrados.</p>'}</div><div class="section-title"><h2>Historial del alumno</h2></div><section class="card">${record.attempts.length?attemptTable([...record.attempts].reverse()):'<p class="muted">Sin intentos.</p>'}</section>`;}
 const students=S.admin.filter(x=>x.profile.role==='student'),active=students.filter(x=>x.record.lessons.length||x.record.attempts.length),avg=students.length?Math.round(students.reduce((s,x)=>s+overview(x.record).pct,0)/students.length):0;
 const difficulties=S.courses.map(c=>({c,weak:students.reduce((n,x)=>n+C.unresolved(x.record,c).length,0)})).sort((a,b)=>b.weak-a.weak);
 return `${heading('Administración','Acompañá cada recorrido.','Avance, evaluaciones y dificultades para orientar el acompañamiento.',`<div class="row"><button class="btn secondary" data-action="refresh-admin">Actualizar</button><button class="btn secondary" data-action="export-admin">${icon('download')}CSV</button></div>`)}${!repo.live?'<div class="note warning">Este panel muestra únicamente perfiles de demostración creados en este navegador. No reúne alumnos de otros equipos.</div>':''}<div class="stats"><div class="stat"><span class="stat-label">Alumnos</span><strong>${students.length}</strong><span>Perfiles registrados</span></div><div class="stat"><span class="stat-label">Con actividad</span><strong>${active.length}</strong><span>Lección o intento registrado</span></div><div class="stat"><span class="stat-label">Avance promedio</span><strong>${avg}%</strong><span>Incluye perfiles sin empezar</span></div></div><div class="section-title"><h2>Seguimiento de alumnos</h2><a href="#/admin/contenido" class="text-link">Editar contenido ${icon('arrow')}</a></div><div class="filters"><input type="search" id="student-search" placeholder="Buscar alumno…" aria-label="Buscar alumno"></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Alumno</th><th>Avance</th><th>Dominadas</th><th>Intentos</th><th>Pendientes</th><th>Detalle</th></tr></thead><tbody id="students-body">${students.map(({profile,record})=>{const o=overview(record);return `<tr data-student="${esc(profile.full_name.toLowerCase())}"><td><strong>${esc(profile.full_name)}</strong>${profile.email?`<p class="small muted">${esc(profile.email)}</p>`:''}</td><td>${o.pct}%${bar(o.pct)}</td><td>${o.mastered}/9</td><td>${record.attempts.length}</td><td>${o.weak}</td><td><a class="text-link" href="#/admin/alumno/${profile.id}">Ver recorrido →</a></td></tr>`;}).join('')}</tbody></table></div><p class="empty" id="students-empty" ${students.length?'hidden':''}>No hay alumnos que coincidan.</p></section><div class="section-title"><h2>Dónde hace falta reforzar</h2></div><div class="grid cols-3">${difficulties.slice(0,3).map(({c,weak})=>`<section class="card"><h3>${esc(c.short)}</h3><div class="result-score" style="font-size:2.5rem;margin:16px 0">${weak}</div><p class="small muted">Errores pendientes sumados entre alumnos. Un alumno puede aportar más de uno.</p></section>`).join('')}</div><p class="small muted spaced">Los resultados son formativos y enviados por el navegador. Para exámenes con valor certificante hace falta corrección y control de intentos del lado del servidor.</p>`;
}
function contentEditor(){const selected=getRoute()[2]||S.courses[0].id,c=courseBy(selected)||S.courses[0];return `<a class="crumb" href="#/admin">${icon('back')}Administración</a>${heading('Edición pedagógica','Contenido bajo tu control.','Editá títulos, lecciones, opciones y explicaciones. Los identificadores se conservan para mantener el seguimiento.')}<div class="note warning">Las ediciones afectan a todos los alumnos. Cambiar la respuesta correcta no recalifica intentos anteriores. Los desafíos se editan en el código. Descargá una copia antes de cambiar el banco de preguntas.</div><div class="filters spaced"><select id="editor-course" aria-label="Materia a editar">${S.courses.map(x=>`<option value="${x.id}" ${c.id===x.id?'selected':''}>${esc(x.short)}</option>`).join('')}</select><button class="btn secondary" data-action="export-content">Descargar contenido actual</button></div><form id="content-form" class="form-grid"><label>Contenido de ${esc(c.short)} · JSON<textarea name="content" class="editor" spellcheck="false">${esc(JSON.stringify(c,null,2))}</textarea></label><div class="row"><button class="btn" type="submit">Validar y guardar cambios</button><a class="btn secondary" href="#/materia/${c.id}">Ver materia</a></div><div id="content-status" class="form-status" role="status"></div></form>`;}
let renderVersion=0;
async function render(){
 cleanup();cleanup=()=>{};const version=++renderVersion;
 if(!repo){return;}
 if(!S.user||S.recovery){app.innerHTML=authView();return;}
 const r=getRoute(),page=r[0]||'inicio';
 // Se descarta un intento sin terminar al salir de su ruta, sin registrar un resultado parcial.
 if(page!=='evaluar'){S.quiz=null;S.result=null;}
 if(page==='admin'&&S.user.role==='admin'&&!S.admin){app.innerHTML=shell('<div class="card">Cargando seguimiento…</div>');try{S.admin=await repo.all();}catch(e){if(version!==renderVersion)return;app.innerHTML=shell(`<div class="note warning">No se pudo cargar el panel: ${esc(errorText(e))}</div><button class="btn spaced" data-action="refresh-admin">Reintentar</button>`);return;}if(version!==renderVersion)return;}
 let html,c;
 switch(page){
 case 'inicio':html=dashboard();break;
 case 'materias':html=catalogue();break;
 case 'materia':c=courseBy(r[1]);html=!c?notFound():r[2]==='leccion'?c.lessons.some(l=>l.id===r[3])?lessonView(c,c.lessons.find(l=>l.id===r[3])):notFound():courseView(c);break;
 case 'simuladores':html=heading('Laboratorios interactivos','Menos imaginar.<br>Más experimentar.','Explorá libremente y resolvé el desafío para registrar la práctica en tu materia.')+`<div class="grid cols-2">${labCard('vor')}${labCard('aero')}</div>`;break;
 case 'evaluaciones':html=examsView();break;
 case 'evaluar':c=courseBy(r[1]);html=c?quizView(c,r[2]||'practice'):notFound();break;
 case 'desafio':c=courseBy(r[1]);html=c?challengeView(c):notFound();break;
 case 'progreso':html=progressView();break;
 case 'recursos':html=resourcesView();break;
 case 'perfil':html=profileView();break;
 case 'cambiar-clave':if(repo.live){S.auth='password';app.innerHTML=authView();return;}html=notFound();break;
 case 'admin':html=adminView();break;
 default:html=notFound();
 }
 app.innerHTML=shell(html);document.title=(c?.short||NAV.find(n=>n[0]===page)?.[1]||'Campus')+' · '+NAME;
 if(page==='materia'&&r[2]==='leccion'&&c){const l=c.lessons.find(x=>x.id===r[3]);if(l&&S.record.last?.lesson!==l.id){const next=clone(S.record);next.last={course:c.id,lesson:l.id,at:new Date().toISOString()};try{await commit(next,'learning');}catch(e){notify('No se pudo guardar el punto de lectura: '+errorText(e),true);}if(version!==renderVersion)return;}}
 if(page==='desafio'&&c){if(['vor','aero'].includes(c.challenge.type)){cleanup=window.CampusSim.mount(c.challenge.type,$('#main'),result=>saveChallenge(c,result));}if(c.challenge.type==='performance')mountBalance();}
}
function mountBalance(){const input=$('#baggage');function update(){const b=Number(input.value),r=C.balance(b);$('#baggage-out').textContent=b+' kg';$('#balance-weight').textContent=r.weight.toFixed(0)+' kg';$('#balance-moment').textContent=(780+2*b).toFixed(1)+' kg·m';$('#balance-cg').textContent=r.cg.toFixed(3)+' m';const n=$('#balance-status');n.textContent=r.allowed?'Cumple los dos límites del ejercicio.':'No cumple todos los límites: revisá peso y centro de gravedad.';n.classList.toggle('warning',!r.allowed);n.classList.toggle('success',r.allowed);}input.oninput=update;update();}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
const safeCsv=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
function exportAdmin(){const rows=[['Alumno','Materia','Avance (%)','Estado','Lecciones','Mejor evaluación (%)','Desafío','Errores pendientes']];S.admin.filter(x=>x.profile.role==='student').forEach(({profile,record})=>S.courses.forEach(c=>{const p=C.progress(record,c);rows.push([profile.full_name,c.title,p.pct,p.status,`${p.done}/${p.total}`,p.best,p.challenge?'Aprobado':'Pendiente',p.weak]);}));download('seguimiento-alumnos.csv','\ufeff'+rows.map(row=>row.map(safeCsv).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
async function action(el){const act=el.dataset.action;
 switch(act){
 case 'menu':$('.sidebar').classList.add('open');$('.scrim').classList.add('show');el.setAttribute('aria-expanded','true');break;
 case 'close-menu':$('.sidebar').classList.remove('open');$('.scrim').classList.remove('show');document.querySelector('[data-action=menu]')?.setAttribute('aria-expanded','false');break;
 case 'demo':await enter(await repo.loginDemo(el.dataset.role));break;
 case 'auth-mode':S.auth=el.dataset.mode;S.error='';S.message='';render();break;
 case 'logout':authSequence++;await repo.logout();S.user=null;S.record=C.blank();S.quiz=null;S.admin=null;S.auth='login';S.message='';S.error='';history.replaceState(null,'',location.pathname+location.search);render();break;
 case 'lesson-done':{const next=clone(S.record),lid=el.dataset.lesson;next.lessons=next.lessons.includes(lid)?next.lessons.filter(x=>x!==lid):[...next.lessons,lid];next.last={course:el.dataset.course,lesson:lid,at:new Date().toISOString()};await commit(next,'learning');render();notify(next.lessons.includes(lid)?'Lección completada y guardada.':'Lección marcada como pendiente.');break;}
 case 'quiz-restart':S.quiz=null;S.result=null;go(`evaluar/${el.dataset.course}/${el.dataset.mode}`);break;
 case 'export-progress':download('mi-progreso-campus.json',JSON.stringify({version:2,exportedAt:new Date().toISOString(),profile:{name:S.user.full_name},record:S.record},null,2),'application/json');break;
 case 'export-content':download('contenido-campus.json',JSON.stringify(S.courses,null,2),'application/json');break;
 case 'refresh-admin':S.admin=null;await render();break;
 case 'export-admin':if(S.user.role==='admin'&&S.admin)exportAdmin();break;
 }
}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;el.disabled=true;try{await action(el);}catch(err){notify(errorText(err),true);}finally{el.disabled=false;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.scrim')?.classList.remove('show');}});
function filterCourses(){const q=($('#course-search')?.value||'').trim().toLowerCase(),status=$('#course-status')?.value||'';let count=0;document.querySelectorAll('[data-course].course-card').forEach(el=>{const c=courseBy(el.dataset.course),ok=(c.title+' '+c.description).toLowerCase().includes(q)&&(!status||C.progress(S.record,c).status===status);el.hidden=!ok;if(ok)count++;});$('#course-count').textContent=count+' '+(count===1?'materia':'materias');$('#course-empty').hidden=count>0;}
document.addEventListener('input',e=>{if(e.target.id==='course-search')filterCourses();if(e.target.id==='student-search'){const q=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('[data-student]').forEach(el=>{el.hidden=!el.dataset.student.includes(q);if(!el.hidden)count++;});$('#students-empty').hidden=count>0;}});
document.addEventListener('change',e=>{if(e.target.id==='course-status')filterCourses();if(e.target.id==='editor-course')go('admin/contenido/'+e.target.value);});
async function submitQuiz(form){const qz=S.quiz,q=qz.questions[qz.index],isExam=qz.mode==='exam';
 if(!qz.checked){const value=new FormData(form).get('answer');if(value===null)throw new Error('Elegí una respuesta.');qz.answers[q.id]=Number(value);if(!isExam){qz.checked=true;render();return;}}
 if(qz.index<qz.questions.length-1){qz.index++;qz.checked=false;render();return;}
 // ID estable: si una respuesta de red se pierde, el reintento no duplica el intento.
 const attempt=qz.pendingAttempt||(qz.pendingAttempt={id:id(),course:qz.course,mode:qz.mode,...C.grade(qz.questions,qz.answers),at:new Date().toISOString()});
 const next=clone(S.record);if(!next.attempts.some(a=>a.id===attempt.id))next.attempts.push(attempt);
 await commit(next,'attempt',attempt);S.result={attempt,questions:qz.questions};render();notify('Intento guardado.');
}
async function submit(form){const data=Object.fromEntries(new FormData(form)),r=getRoute(),c=courseBy(r[1]);
 switch(form.id){
 case 'demo-profile':await enter(await repo.loginDemo('student',data.name.trim()||'Alumno Demo'));break;
 case 'auth-form':S.error='';S.message='';try{if(S.auth==='forgot'){await repo.forgot(data.email.trim());S.message='Si existe una cuenta con ese email, recibirás un enlace de recuperación.';render();}else if(S.auth==='register'){const user=await repo.register(data.name.trim(),data.email.trim(),data.password);if(user)await enter(user);else{S.message='Revisá tu email para confirmar la cuenta antes de ingresar.';S.auth='login';render();}}else await enter(await repo.login(data.email.trim(),data.password));}catch(e){S.error=errorText(e);render();}break;
 case 'auth-password':if(data.password!==data.repeat)throw new Error('Las contraseñas no coinciden.');await repo.password(data.password);S.recovery=false;S.auth='login';S.message='Contraseña actualizada.';if(!S.user){const user=await repo.session();if(user)await enter(user);else render();}else go('perfil');break;
 case 'profile-form':{const name=data.name.trim();if(!name)throw new Error('Ingresá un nombre.');S.user=await repo.profile(name);render();notify('Nombre actualizado.');break;}
 case 'quiz-form':await submitQuiz(form);break;
 case 'challenge-form':{const fields=c.challenge.fields,correct=fields.filter((f,i)=>Number(data['field-'+i])===f.answer).length,result={passed:correct===fields.length,score:Math.round(100*correct/fields.length),evidence:fields.map((f,i)=>({field:i,selected:Number(data['field-'+i]),correct:Number(data['field-'+i])===f.answer}))};await saveChallenge(c,result);$('#challenge-feedback').textContent=result.passed?'Desafío aprobado y guardado.':'Intento guardado. Revisá la explicación y volvé a intentarlo.';$('#challenge-explanation').innerHTML=`<div class="note ${result.passed?'success':'warning'} spaced">${esc(c.challenge.explanation)}</div>`;break;}
 case 'performance-form':{const baggage=Number($('#baggage').value),b=C.balance(baggage),passed=b.allowed&&data.criterion==='both';await saveChallenge(c,{passed,score:passed?100:0,evidence:{baggage,...b,criterion:data.criterion}});$('#challenge-feedback').textContent=passed?'Planificación aprobada y guardada: ambos límites se cumplen.':'Revisá: deben cumplirse peso y CG, y hay que identificar ambos límites.';break;}
 case 'content-form':if(S.user.role!=='admin')throw new Error('Acceso restringido.');{let edited;try{edited=JSON.parse(data.content);}catch{throw new Error('El JSON no es válido. Revisá comas, llaves y comillas.');}const validated=validateCourse(edited,getRoute()[2]||S.courses[0].id);await repo.content(validated);S.courses=S.courses.map(x=>x.id===validated.id?validated:x);$('#content-status').textContent='Contenido validado y guardado. Los intentos anteriores conservan su calificación.';notify('Contenido actualizado.');break;}
 }
}
document.addEventListener('submit',async e=>{const form=e.target;if(!['demo-profile','auth-form','auth-password','profile-form','quiz-form','challenge-form','performance-form','content-form'].includes(form.id))return;e.preventDefault();const button=form.querySelector('button[type="submit"]');if(button?.disabled)return;if(button)button.disabled=true;try{await submit(form);}catch(err){const status=form.querySelector('.form-status');if(status)status.textContent=errorText(err);notify(errorText(err),true);}finally{if(button?.isConnected)button.disabled=false;}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('beforeunload',e=>{if(S.quiz&&!S.result){e.preventDefault();e.returnValue='';}});
async function boot(){try{const configured=Boolean(CFG.SUPABASE_URL||CFG.SUPABASE_ANON_KEY);repo=configured?await cloudRepo():storageRepo();if(repo.onAuth)repo.onAuth();const user=await repo.session();if(user)await enter(user);else render();}catch(e){app.innerHTML=`<main class="error-page"><span class="eyebrow">No pudimos iniciar</span><h1 class="spaced">Revisemos la conexión.</h1><p class="muted spaced">${esc(errorText(e))}</p><button class="btn spaced" onclick="location.reload()">Reintentar</button></main>`;}}
boot();
})();
